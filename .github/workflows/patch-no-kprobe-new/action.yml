name: 'Patch Kernel for no-kprobe (Tracepoint Supported).'

runs:
  using: 'composite'
  steps:
      - name: Patch Kernel for no-kprobe
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # Function
          PACK_FILES(){
            temp_dir=$(mktemp -d)
            find . -name "*.rej" -exec cp --parents {} "$temp_dir" \;
            find . -name "*.rej" | sed 's/\.rej$//' | xargs -I {} test -f {} && find . -name "*.rej" | sed 's/\.rej$//' | xargs -I {} cp --parents {} "$temp_dir"
            tar -czf "rej_files_kernel_write_read.tar.gz" -C "$temp_dir" .
            rm -rf "$temp_dir"
            echo "[+] Packed Successfully."

            find . -type f \( -name "*.rej" -o -name "*.orig" \) -delete
            echo "[+] Removed all .rej and .orig files."
            echo "[+] =================================== "
          }
          REJ_FOUND(){
            if [[ "${{ env.BUILD_DEBUGGER }}" == "true" ]]; then
                echo "[+] Checking kernel write and read patch rej files..."
                mapfile -t REJ_FILES < <(find . -type f -name "*.rej")
                if [ ${#REJ_FILES[@]} -eq 0 ]; then
                    echo "[+] Your kernel have no any rej files, Skipped."
                else
                    for CAT_REJ in "${REJ_FILES[@]}"; do
                        echo "[-] $CAT_REJ"
                        cat "$CAT_REJ"
                    done
                    if [[ "${{ env.SKIP_PATCH }}" != "true" ]]; then
                        echo "[-] Please fix it, or skipped it."
                        false
                    else
                        echo "[!] Skipped patch error."
                    fi
                fi
                echo "[+] =================================== "
            fi
          }

          if [[ "${{ env.SUSFS_FIXED }}" == "true" ]]; then
                if [[ -z "${{ env.SUSFS_PATCH_FIXED }}" ]]; then
                    echo "[-] error, susfs fixed patches is empty."
                    false
                fi
                IFS=',' read -r -a PATCH_ARRAY <<< "${{ env.SUSFS_PATCH_FIXED }}"
                for PATCH in "${PATCH_ARRAY[@]}"; do
                    if [[ -n "${{ env.SUSFS_FOLDER_FIXED }}" ]]; then
                        wget -qO "$PATCH.patch" "https://raw.githubusercontent.com/${{ env.PATCHES_SOURCE }}/${{ env.PATCHES_BRANCH }}/${{ env.SUSFS_FOLDER_FIXED }}/$PATCH.patch"
                    else
                        wget -qO "$PATCH.patch" "https://raw.githubusercontent.com/${{ env.PATCHES_SOURCE }}/${{ env.PATCHES_BRANCH }}/$PATCH.patch"
                    fi
                    patch -p1 < "$PATCH.patch" || true
                    echo "[+] patched $PATCH.patch."
                done
                REJ_FOUND
          fi

          if [[ "${{ env.HOOK_METHOD }}" == "syscall" ]]; then
            if [[ "${{ env.HOOK_OLDER }}" != "true" ]]; then
                KERNEL_VERSION=$(make kernelversion)
                FIRST_VERSION=$(echo "$KERNEL_VERSION" | cut -d '.' -f 1)
                SECOND_VERSION=$(echo "$KERNEL_VERSION" | cut -d '.' -f 2)
                
                wget -qO syscall_1_3_new.patch https://raw.githubusercontent.com/gooder123/NonGKI_Patcher/main/kernelsu_ksu_hook_1_3.patch
                patch -p1 < syscall_1_3_new.patch || true
                echo "[+] Patched syscall."

                if [[ $FIRST_VERSION -lt 4 ]] || { [[ $FIRST_VERSION -eq 4 ]] && [[ $SECOND_VERSION -le 9 ]]; }; then
                    echo "[-] Your Kernel Version is <= 4.9. Trying to Backport older patch..."
                    wget -qO syscall_1_3_older.patch https://raw.githubusercontent.com/gooder123/NonGKI_Patcher/main/kernelsu_ksu_hook_1_3_older.patch
                    patch -p1 < syscall_1_3_older.patch || true
                    echo "[+] Patched older syscall."
                    REJ_FOUND
                fi
                REJ_FOUND

                if [[ "${{ env.KERNEL_PATCH }}" == "true" ]]; then
                    wget -qO /tmp/Patches.zip https://github.com/gooder123/NonGKI_Patcher/archive/refs/heads/main.zip
                    unzip -q /tmp/Patches.zip -d /tmp/Patches_Dir
                    mv /tmp/Patches_Dir/NonGKI_Patcher-main /tmp/Patches
                    
                    if [[ $FIRST_VERSION == 3 ]] && [[ $SECOND_VERSION == 18 ]]; then
                        cp /tmp/Patches/Patch/backport_kernel_read_and_kernel_write_3.18.patch ./
                        patch -p1 < backport_kernel_read_and_kernel_write_3.18.patch || true
                        echo "[+] Patched kernel_write and kernel_read."
                    elif [[ $FIRST_VERSION == 4 ]] && [[ $SECOND_VERSION == 9 ]]; then
                        cp /tmp/Patches/Patch/backport_kernel_read_and_kernel_write_4.9.patch ./
                        patch -p1 < backport_kernel_read_and_kernel_write_4.9.patch || true
                        echo "[+] Patched kernel_write and kernel_read."
                    fi
                    REJ_FOUND
                fi

                echo "[+] executed backport patch (contain kernel_read and kernel_write patch) successfully."
            else
                cp /tmp/Patches/backport_patches.sh ./
                bash backport_patches.sh
                echo "executed backport patch successfully."

                if [[ "${{ env.BASEBAND_GUARD_ENABLE }}" != "true" ]]; then
                    cp /tmp/Patches/backport_selinux_patches.sh ./
                    bash backport_selinux_patches.sh
                    echo "[+] Patched SELinux."
                else
                    echo "[-] Skipped SELinux Patch."
                fi
            fi

          elif [[ "${{ env.HOOK_METHOD }}" == "normal" ]]; then
            echo "[+] Skipped, Kprobe method hasn't patch"

          # 👇👇👇 核心改造：开启 SukiSU 专属 v1.4 现代 Manual Hook 👇👇👇
          elif [[ "${{ env.HOOK_METHOD }}" == "sukisu_manual" ]]; then
            echo "==== 🎯 开启 SukiSU 专属 v1.4 现代 Manual Hook (锁定本体版) ===="
            
            # 1. 启动全盘雷达，直接寻找原始的 ksu.h！不再找那个不存在的替身！
            echo "[+] 正在扫描 ksu.h 物理路径..."
            KSU_HEADER_PATH=$(find $GITHUB_WORKSPACE/device_kernel -type f -name "ksu.h" | head -n 1)
            
            if [ -z "$KSU_HEADER_PATH" ]; then
                echo "[-] 致命错误：整个内核源码里连 ksu.h 都找不到！说明拉取 SukiSU 源码彻底失败！"
                false
            fi
            echo "[+] 锁定核心头文件本体物理坐标：$KSU_HEADER_PATH"
            
            # 2. 清除上一回合失败残留的 include（防止代码重复）
            sed -i '/#include <linux\/kernelsu.h>/d' fs/exec.c fs/open.c fs/read_write.c fs/stat.c
            
            # 3. 撕掉伪装，强行注入带绝对路径的 ksu.h！
            sed -i "/#include <linux\/fs.h>/a #include \"$KSU_HEADER_PATH\"" fs/exec.c fs/open.c fs/read_write.c fs/stat.c
            
            # 4. 注入 4.14 专属的底层拦截代码
            sed -i 's/retval = bprm_execve(bprm, fd, filename, flags);/ksu_handle_execveat(\&fd, \&filename, \&flags, \&bprm);\n\tretval = bprm_execve(bprm, fd, filename, flags);/g' fs/exec.c
            sed -i 's/return do_faccessat(dfd, filename, mode, 0);/ksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\n\treturn do_faccessat(dfd, filename, mode, 0);/g' fs/open.c
            sed -i 's/ret = vfs_read(f.file, buf, count, \&pos);/ksu_handle_vfs_read(\&f.file, \&buf, \&count, \&pos);\n\t\tret = vfs_read(f.file, buf, count, \&pos);/g' fs/read_write.c
            sed -i 's/error = vfs_fstatat(dfd, filename, \&stat, flag);/ksu_handle_stat(\&dfd, \&filename, \&flag);\n\terror = vfs_fstatat(dfd, filename, \&stat, flag);/g' fs/stat.c

            echo "[+] 现代 Manual Hook 物理注入完毕！"
            REJ_FOUND
            
          else
            echo "[-] please input a vaild option!"
            false

          fi

      - name: Upload Build Kernel Patch Rejected Files
        if: env.BUILD_DEBUGGER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patch_kernel_write_read_rejected_files
          path: |
            device_kernel/rej_files_kernel_write_read.tar.gz
