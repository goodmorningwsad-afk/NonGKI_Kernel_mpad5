name: 'Patch SuSFS for Kernel.'
description: 'Patch SuSFS v1.5.5 for Kernel 4.14'

runs:
  using: 'composite'
  steps:
      - name: Get SuSFS
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          rm -rf susfs_patches
          echo "==== 开始拉取 Simonpunk 官方 4.14 专属补丁 ===="
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.14 susfs_patches --depth=1
          cp -r susfs_patches/kernel_patches/* ./
          echo "[+] 官方 1.5.5 (4.14分支) 补丁已就位！"

      - name: Patch SuSFS
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          PACK_FILES(){
            temp_dir=$(mktemp -d)
            find . -name "*.rej" -exec cp --parents {} "$temp_dir" \;
            find . -name "*.rej" | sed 's/\.rej$//' | xargs -I {} test -f {} && find . -name "*.rej" | sed 's/\.rej$//' | xargs -I {} cp --parents {} "$temp_dir"
            tar -czf "rej_files_1.5.5.tar.gz" -C "$temp_dir" .
            rm -rf "$temp_dir"
            echo "[+] Packed Successfully."
            find . -type f \( -name "*.rej" -o -name "*.orig" \) -delete
          }

          if grep -q "CONFIG_KSU_SUSFS" "fs/namespace.c"; then
            echo ">SuSFS is already patched, skipping.<"
            echo "SUSFS_SKIP=true" >> $GITHUB_ENV
          else
            echo "==== 严格执行官方 4.14 专属挂载流程 ===="
            cp susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
            cp susfs_patches/kernel_patches/50_add_susfs_in_kernel-4.14.patch ./
            cp susfs_patches/kernel_patches/fs/* ./fs/
            cp susfs_patches/kernel_patches/include/linux/* ./include/linux/
            
            # 🚨 SukiSU 跳过 KernelSU 内部补丁动作
            echo "[-] 正在缝合 4.14 内核深层逻辑..."
            patch -p1 < 50_add_susfs_in_kernel-4.14.patch || true

            echo "==== 开始手工修复 SUSFS 1.5.5 冲突点 ===="
            
            # 修复 task_mmu.c
            cat << 'EOF' > fix_mmu.patch
          --- a/fs/proc/task_mmu.c
          +++ b/fs/proc/task_mmu.c
          @@ -19,6 +19,9 @@
           #include <linux/shmem_fs.h>
           #include <linux/uaccess.h>
           #include <linux/mm_inline.h>
          +#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
          +#include <linux/susfs_def.h>
          +#endif
           #include <linux/ctype.h>
           
           #include <asm/elf.h>
          EOF
            patch -p1 < fix_mmu.patch || true
            rm -f fs/proc/task_mmu.c.rej
            
            # 修复 cmdline.c
            cat << 'EOF' > fix_cmdline.patch
          --- a/fs/proc/cmdline.c
          +++ b/fs/proc/cmdline.c
          @@ -4,6 +4,9 @@
           #include <linux/proc_fs.h>
           #include <linux/seq_file.h>
          +#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          +extern int susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);
          +#endif
           #ifdef CONFIG_INITRAMFS_IGNORE_SKIP_FLAG
           #include <asm/setup.h>
           #endif
          @@ -28,6 +31,12 @@
           
           static int cmdline_proc_show(struct seq_file *m, void *v)
           {
          +#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          +	if (!susfs_spoof_cmdline_or_bootconfig(m)) {
          +		seq_putc(m, '\n');
          +		return 0;
          +	}
          +#endif
           #ifdef CONFIG_INITRAMFS_IGNORE_SKIP_FLAG
           	seq_printf(m, "%s\n", proc_command_line);
           #else
          EOF
            patch -p1 < fix_cmdline.patch || true
            rm -f fs/proc/cmdline.c.rej
            
            echo "==== SUSFS 核心冲突点手工缝合完毕！ ===="
          fi

          if [[ "${{ env.BUILD_DEBUGGER }}" == "true" ]]; then
            echo "[+] Checking SuSFS v1.5.5 (4.14 branch) rej files..."
            mapfile -t REJ_FILES < <(find . -type f -name "*.rej")
            if [ ${#REJ_FILES[@]} -eq 0 ]; then
                echo "[+] Your kernel have no any rej files, Skipped."
            else
                for CAT_REJ in "${REJ_FILES[@]}"; do
                    echo "[-] Found .rej file: $CAT_REJ"
                    cat $CAT_REJ
                done
                if [[ "${{ env.SKIP_PATCH }}" != "true" ]] || [ -z "${{ env.SUSFS_PATCH_FIXED }}" ]; then
                    echo "[-] Found .rej files, Stopped! "
                    PACK_FILES
                    false
                fi
            fi
          fi

      - name: Upload Build Patch Rejected Files
        if: env.BUILD_DEBUGGER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patch_rejected_files
          path: device_kernel/rej_files_*
