name: 'Patch Baseband Guard for Kernel.'

runs:
  using: 'composite'
  steps:
      - name: Patch Baseband Guard
        if: ${{ env.BASEBAND_GUARD_ENABLE == 'true' }}
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          
          echo "==== 🔴 1. 战前铺垫：铺设物理隔离带 ===="
          echo "" >> security/selinux/Makefile
          
          echo "==== 🔴 2. 执行挂载：呼叫官方补丁脚本 ===="
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          
          echo "==== 🔴 3. 终极净化：抹杀隐藏的注释陷阱与幽灵字符 ===="
          # 物理超度 Windows 幽灵字符
          sed -i 's/\r//g' security/selinux/Makefile
          sed -i 's/\r//g' security/selinux/include/objsec.h
          
          # 🚨 终极杀手刀：拔掉上游作者写在 shell 命令里的 # 号，防止 Make 引擎误触注释截断机制！
          sed -i "s/'#define DEFINE_LSM(lsm)'/'define DEFINE_LSM(lsm)'/g" security/selinux/Makefile
          
          # 修复旧语法规范
          sed -i 's/ifeq(/ifeq (/g' security/selinux/Makefile
          sed -i 's/ifneq(/ifneq (/g' security/selinux/Makefile
          
          echo "==== 🔴 4. 锁定架构配置 ===="
          echo "CONFIG_BBG=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

          # 自动探测现代化 LSM 架构
          if grep -q "DEFINE_LSM" "include/linux/lsm_hooks.h" && ! grep -q "baseband_guard" "./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"; then
            echo "=======Detect======="
            echo "= Found DEFINE_LSM ="
            echo "===================="

            if grep -q "CONFIG_LSM" "./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"; then
                echo "[-] Have not found default CONFIG_LSM values."
                echo 'CONFIG_LSM="lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,baseband_guard"' >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
            else
                echo "[+] Found default CONFIG_LSM values."
                sed -i 's/\(CONFIG_LSM="[^"]*\)"/\1,baseband_guard"/' ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
            fi
          fi
          
          echo "✅ Patched Baseband Guard for your kernel successfully."
