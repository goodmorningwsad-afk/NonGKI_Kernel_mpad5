name: Build Xiaomi 10 Youth (vangogh) (SukiSU + SuSFS 2.0.0)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "Xiaomi 10 Youth"
  DEVICE_CODENAME : "vangogh"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 PYTHON=/usr/bin/python2"

  KERNEL_SOURCE : "https://github.com/furkancakmak34x/kernel_xiaomi_sm7250.git"
  KERNEL_BRANCH : "yuragi"

  CLANG_SOURCE : "https://github.com/ZyCromerZ/Clang/releases/download/12.0.1-20230207-release/Clang-12.0.1-20230207.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "milito_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false
  
  SUSFS_UPDATE : "true"
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "true" 
  KERNELSU_AUTO_FORK : "sukisu" 
  SUSFS_ENABLE : "true"
  SUSFS_FIXED : ""
 
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : "true"
  NEED_SAFE_DTBO : "true"
  ROM_TEXT : "miui_a12"
  PYTHON_VERSION: "2" 
  PACK_METHOD: "Anykernel3" 
  
  KERNELSU_METHOD: "shell" 

  PATCHES_SOURCE: "" 
  PATCHES_BRANCH: "" 
  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: ""
  REKERNEL_ENABLE: "true" 

  HOOK_METHOD: "syscall" 
  HOOK_OLDER: "false" 

  KERNEL_PATCH: "true" 

  KPM_ENABLE: "true" 
  KPM_INLINE: "false" 
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" 

  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false" 
  HIDE_STUFF: "false" 

  GENERATE_DTB: "true" 
  GENERATE_CHIP: "qcom" 

  BUILD_DEBUGGER: "true" 
  SKIP_PATCH: "false" 

  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true" 

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🚑 提取案发现场物证 (打孔崩溃时强制触发)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Crime_Scene_Files
          path: |
            device_kernel/fs/namei.c
            device_kernel/**/*.rej

      - name: 🩹 Fix Kernel Bugs & Extra Options
        run: |
          set -e
          cd $GITHUB_WORKSPACE/device_kernel
          
          if [ -f ".kernel_bugs_fixed" ]; then
              echo "⏭️ 内核 Bug 已修复过，跳过！"
              exit 0
          fi

          echo "==== 1. 修复高版本 Clang 编译老内核的通病 ===="
          grep -q "<asm/insn.h>" arch/arm64/kernel/module-plts.c || sed -i '1i #include <asm/insn.h>' arch/arm64/kernel/module-plts.c
          
          echo "==== 2. 修复 cgroup 函数名拼写错误 ===="
          sed -i '/\.write_/s/write_wrapper/write/g' kernel/sched/tune.c
          sed -i 's/boost_write_wrapper(/__attribute__((unused)) boost_write_wrapper(/g' kernel/sched/tune.c
          sed -i 's/prefer_idle_write_wrapper(/__attribute__((unused)) prefer_idle_write_wrapper(/g' kernel/sched/tune.c
          
          echo "==== 3. 抹除 NTFS3 驱动超前参数 ===="
          [ -f fs/ntfs3/Makefile ] && sed -i 's/-Wunused-but-set-variable//g' fs/ntfs3/Makefile
          [ -f fs/ntfs3/Makefile ] && sed -i 's/-Wno-unused-but-set-variable//g' fs/ntfs3/Makefile
          
          echo "==== 4. 物理补全 namei.c 变量声明 ===="
          grep -q "FIXED_UNDECLARED_VAR" fs/namei.c || sed -i '3168s/^/    int error = 0; \/* FIXED_UNDECLARED_VAR *\/ \n/' fs/namei.c
          
          echo "==== 5. 拯救 namespace.c ===="
          grep -q "LineageOS restored" fs/namespace.c || {
              curl -LSs "https://raw.githubusercontent.com/LineageOS/android_kernel_xiaomi_sm7250/lineage-22.1/fs/namespace.c" -o fs/namespace.c
              echo "// LineageOS restored" >> fs/namespace.c
          }

          echo "==== 6. 防止 LTO 爆内存，强制保留 ===="
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' arch/arm64/configs/milito_defconfig
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/milito_defconfig

          touch .kernel_bugs_fixed

      - name: 🔎 战前雷达全盘扫描 (显微镜级排查)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "==== 1. 扫描所有的 SukiSU 相关目录分布 ===="
          find . -maxdepth 3 -type d -iname "*ksu*" -o -iname "*kernelsu*" -o -iname "*sukisu*" | grep -v "out" > ksu_dirs.txt
          cat ksu_dirs.txt
          
          echo "==== 2. 深入 drivers/kernelsu 真实工作区 ===="
          if [ -d "drivers/kernelsu" ]; then
              find drivers/kernelsu -type f | sort > drivers_kernelsu_tree.txt
              cat drivers_kernelsu_tree.txt
              
              echo "==== 3. 提取报错源码：drivers/kernelsu/ksu.c 第 150-165 行 ===="
              sed -n '150,165p' drivers/kernelsu/ksu.c || true
              
              echo "==== 4. 提取所有 include 包含路径 ===="
              grep "^#include" drivers/kernelsu/ksu.c || true
          else
              echo "❌ 未找到 drivers/kernelsu 目录，编译器工作区异常！"
          fi

      - name: 📦 上传雷达扫描报告
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU_Radar_Scan
          path: |
            device_kernel/ksu_dirs.txt
            device_kernel/drivers_kernelsu_tree.txt

      - name: 🩹 Fix SukiSU Bugs & Defconfig Options
        run: |
          set -e
          cd $GITHUB_WORKSPACE/device_kernel
          
          if [ -f ".sukisu_bugs_fixed" ]; then
              echo "⏭️ SukiSU Bug 已修复过，跳过！"
              exit 0
          fi

          echo "==== 1. 自动修复 drivers/kernelsu 内部的路径污染与缺失符号 ===="
          if [ -f "drivers/kernelsu/ksu.c" ]; then
              echo "🩹 正在为 drivers/kernelsu/ksu.c 动手术..."
              
              # 修复被构建脚本污染的 include 路径 (把多余的 kernel/ 前缀剃掉)
              sed -i 's/kernel\/runtime\//runtime\//g' drivers/kernelsu/ksu.c
              sed -i 's/kernel\/feature\//feature\//g' drivers/kernelsu/ksu.c
              sed -i 's/kernel\/sulog\//sulog\//g' drivers/kernelsu/ksu.c
              sed -i 's/kernel\/kpm\//kpm\//g' drivers/kernelsu/ksu.c
              
              # 解决 SukiSU 内部 undefined symbols (静态键和 susfs 钩子)
              echo "" >> drivers/kernelsu/ksu.c
              echo "/* 物理兜底替身：解决 ksu.o 内部未定义符号 */" >> drivers/kernelsu/ksu.c
              echo "#include <linux/jump_label.h>" >> drivers/kernelsu/ksu.c
              echo "struct static_key_false ksu_input_hook_key_false = STATIC_KEY_FALSE_INIT;" >> drivers/kernelsu/ksu.c
              echo "EXPORT_SYMBOL(ksu_input_hook_key_false);" >> drivers/kernelsu/ksu.c
              echo "struct static_key_false ksu_init_rc_hook_key_false = STATIC_KEY_FALSE_INIT;" >> drivers/kernelsu/ksu.c
              echo "EXPORT_SYMBOL(ksu_init_rc_hook_key_false);" >> drivers/kernelsu/ksu.c
              echo "void susfs_extra_works(void) {}" >> drivers/kernelsu/ksu.c
              echo "EXPORT_SYMBOL(susfs_extra_works);" >> drivers/kernelsu/ksu.c
              echo "✅ drivers/kernelsu/ksu.c 修复完成！"
          fi
          
          echo "==== 2. 修复 adb_root.c 辅助函数注入 (在真实工作区修改) ===="
          if [ -f "drivers/kernelsu/feature/adb_root.c" ]; then
              echo 'static inline bool susfs_starts_with(const char *str, const char *prefix) { return strncmp(str, prefix, strlen(prefix)) == 0; }' > /tmp/susfs_str_helpers.h
              echo 'static inline bool susfs_ends_with(const char *str, const char *suffix) { int len = strlen(str); int slen = strlen(suffix); return (len >= slen) && (strcmp(str + len - slen, suffix) == 0); }' >> /tmp/susfs_str_helpers.h
              sed -i '1i #include <linux/string.h>' drivers/kernelsu/feature/adb_root.c
              sed -i '2r /tmp/susfs_str_helpers.h' drivers/kernelsu/feature/adb_root.c
          fi

          echo "==== 3. 修复 event.c 兼容性 ===="
          if [ -f "drivers/kernelsu/sulog/event.c" ]; then
              sed -i 's/\bstrncpy_from_user_nofault(/__strncpy_from_user_nofault(/g' drivers/kernelsu/sulog/event.c || true
              sed -i 's/USER_ARG_NULL, gfp/NULL, gfp/g' drivers/kernelsu/sulog/event.c || true
          fi

          echo "==== 4. 开启内核配置与防线 ===="
          grep -q "\-Wno-unused-function" fs/Makefile || echo "ccflags-y += -Wno-unused-function" >> fs/Makefile
          grep -q "\-Wno-error" fs/Makefile || echo "ccflags-y += -Wno-error" >> fs/Makefile
          grep -q "CONFIG_KSU_MANUAL_HOOK=y" arch/arm64/configs/milito_defconfig || echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/milito_defconfig
          sed -i 's/# CONFIG_USER_NS is not set/CONFIG_USER_NS=y/g' arch/arm64/configs/milito_defconfig
          sed -i 's/# CONFIG_SECCOMP is not set/CONFIG_SECCOMP=y/g' arch/arm64/configs/milito_defconfig
          sed -i 's/# CONFIG_SECCOMP_FILTER is not set/CONFIG_SECCOMP_FILTER=y/g' arch/arm64/configs/milito_defconfig
          grep -q "^CONFIG_SECCOMP=y" arch/arm64/configs/milito_defconfig || echo "CONFIG_SECCOMP=y" >> arch/arm64/configs/milito_defconfig
          grep -q "^CONFIG_SECCOMP_FILTER=y" arch/arm64/configs/milito_defconfig || echo "CONFIG_SECCOMP_FILTER=y" >> arch/arm64/configs/milito_defconfig

          touch .sukisu_bugs_fixed

      - name: 🪝 呼叫 SuSFS 幻影打孔外挂 (含 .rej 冲突收集)
        uses: ./.github/workflows/patch-susfs-new

      - name: 📤 提取并打包已打孔的源码 (用于法医级显微镜审查)
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          echo "==== 正在收集打孔后的核心文件，准备验尸 ===="
          mkdir -p patched_source_files/fs/devpts
          mkdir -p patched_source_files/drivers/input
          mkdir -p patched_source_files/security/selinux
          mkdir -p patched_source_files/fs/proc
          
          [ -f device_kernel/fs/exec.c ] && cp device_kernel/fs/exec.c patched_source_files/fs/
          [ -f device_kernel/fs/open.c ] && cp device_kernel/fs/open.c patched_source_files/fs/
          [ -f device_kernel/fs/read_write.c ] && cp device_kernel/fs/read_write.c patched_source_files/fs/
          [ -f device_kernel/fs/stat.c ] && cp device_kernel/fs/stat.c patched_source_files/fs/
          [ -f device_kernel/fs/namespace.c ] && cp device_kernel/fs/namespace.c patched_source_files/fs/
          [ -f device_kernel/fs/devpts/inode.c ] && cp device_kernel/fs/devpts/inode.c patched_source_files/fs/devpts/
          [ -f device_kernel/drivers/input/input.c ] && cp device_kernel/drivers/input/input.c patched_source_files/drivers/input/
          [ -f device_kernel/security/selinux/hooks.c ] && cp device_kernel/security/selinux/hooks.c patched_source_files/security/selinux/
          [ -f device_kernel/fs/proc/cmdline.c ] && cp device_kernel/fs/proc/cmdline.c patched_source_files/fs/proc/
          [ -f device_kernel/fs/susfs.c ] && cp device_kernel/fs/susfs.c patched_source_files/fs/
          [ -f device_kernel/fs/dcache.c ] && cp device_kernel/fs/dcache.c patched_source_files/fs/
          [ -f device_kernel/fs/readdir.c ] && cp device_kernel/fs/readdir.c patched_source_files/fs/
          [ -f device_kernel/fs/namei.c ] && cp device_kernel/fs/namei.c patched_source_files/fs/
          
          cd patched_source_files
          zip -r ../Patched_Source_Files.zip .
      - name: 📦 上传打孔后源码验证包
        uses: actions/upload-artifact@v4
        with:
          name: Patched_Source_Files
          path: Patched_Source_Files.zip

      - name: 📤 提取官方 SukiSU 补丁脚本 (用于法医级审查)
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          echo "==== 正在查抄官方补丁目录 ===="
          mkdir -p Official_Patches
          [ -d /tmp/Patches ] && cp -r /tmp/Patches/* Official_Patches/ || echo "无 /tmp/Patches 目录跳过"
          [ -f device_kernel/backport_patches.sh ] && cp device_kernel/backport_patches.sh Official_Patches/
          [ -f device_kernel/backport_selinux_patches.sh ] && cp device_kernel/backport_selinux_patches.sh Official_Patches/
          cp device_kernel/*.patch Official_Patches/ 2>/dev/null || echo "无 .patch 文件跳过"
          cd Official_Patches
          zip -r ../Official_Patches.zip .
      - name: 📦 上传官方补丁审查包
        uses: actions/upload-artifact@v4
        with:
          name: Official_Patches
          path: Official_Patches.zip

      - name: 📤 提取 SuSFS 冲突原件 ( .rej 查抄)
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          echo "==== 正在满世界抓捕 .rej 冲突文件 ===="
          mkdir -p Rej_Files
          find device_kernel -name "*.rej" -exec cp {} Rej_Files/ \;
          cd Rej_Files
          zip -r ../Rej_Files.zip . || echo "空包安全跳过"

      - name: 📦 上传冲突审查包 (.rej)
        uses: actions/upload-artifact@v4
        with:
          name: SuSFS_Rej_Files
          path: Rej_Files.zip
          if-no-files-found: ignore

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🕵️‍♂️ 提取核心嫌疑源码 (fs/susfs.c 案发现场)
        if: always()
        run: |
          echo "==== 正在提取法医级源码物证 ===="
          mkdir -p $GITHUB_WORKSPACE/Suspect_Source
          cp $GITHUB_WORKSPACE/device_kernel/fs/susfs.c $GITHUB_WORKSPACE/Suspect_Source/ || echo "❌ 找不到 fs/susfs.c 源码！"
          cp $GITHUB_WORKSPACE/device_kernel/include/linux/susfs.h $GITHUB_WORKSPACE/Suspect_Source/ || true
          cp $GITHUB_WORKSPACE/device_kernel/include/linux/susfs_def.h $GITHUB_WORKSPACE/Suspect_Source/ || true
          cd $GITHUB_WORKSPACE/Suspect_Source
          zip -r ../Suspect_Source.zip .
      - name: 📦 上传嫌疑源码包
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Suspect_Source_Files
          path: Suspect_Source.zip

      - name: 🕵️‍♂️ 提取 SukiSU 核心隐身源码 (终极全盘扫描版)
        if: always()
        run: |
          echo "==== 正在全盘雷达扫描 SukiSU 隐身核心源码 ===="
          mkdir -p $GITHUB_WORKSPACE/SukiSU_Suspects
          KSU_DIR=$(find $GITHUB_WORKSPACE -type d \( -name "KernelSU" -o -name "kernelsu" \) -not -path "*/out/*" | head -n 1)
          if [ -n "$KSU_DIR" ]; then
              find "$KSU_DIR" -name "sucompat.c" -exec cp {} $GITHUB_WORKSPACE/SukiSU_Suspects/ \; || true
              find "$KSU_DIR" -name "sucompat.h" -exec cp {} $GITHUB_WORKSPACE/SukiSU_Suspects/ \; || true
              find "$KSU_DIR" -name "su_mount_ns.c" -exec cp {} $GITHUB_WORKSPACE/SukiSU_Suspects/ \; || true
              find "$KSU_DIR" -name "allowlist.c" -exec cp {} $GITHUB_WORKSPACE/SukiSU_Suspects/ \; || true
              find "$KSU_DIR" -name "syscall_handler.c" -exec cp {} $GITHUB_WORKSPACE/SukiSU_Suspects/ \; || true
          fi
          cd $GITHUB_WORKSPACE/SukiSU_Suspects
          zip -r ../SukiSU_Suspects.zip . || true
      - name: 📦 上传 SukiSU 嫌疑源码包
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SukiSU_Suspect_Source
          path: SukiSU_Suspects.zip
          if-no-files-found: ignore

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
