name: Build Xiaomi 10 Youth (vangogh) (PURE TEST)

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME : "Xiaomi 10 Youth"
  DEVICE_CODENAME : "vangogh"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 PYTHON=/usr/bin/python2"

  KERNEL_SOURCE : "https://github.com/furkancakmak34x/kernel_xiaomi_sm7250.git"
  KERNEL_BRANCH : "yuragi"

  CLANG_SOURCE : "https://github.com/ZyCromerZ/Clang/releases/download/12.0.1-20230207-release/Clang-12.0.1-20230207.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/lito-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "sukisu"
  SUSFS_ENABLE : "true"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : "true"
  NEED_SAFE_DTBO : "true"
  ROM_TEXT : "miui_a12"
  PYTHON_VERSION: "2"
  PACK_METHOD: "Anykernel3"
  KERNELSU_METHOD: "shell"
  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "none"
  HOOK_OLDER: "false"
  KERNEL_PATCH: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"
  GENERATE_DTB: "true"
  GENERATE_CHIP: "qcom"
 
  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
   # container: ubuntu:focal 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      
      - name: 🩹 修复原厂源码遗漏的头文件与结构体 (全局终极补丁汇总 - 严格排错版)
        run: |
          # 开启严格模式：遇到任何错误立即终止，并打印执行的每一行指令方便排错
          set -ex
          
          cd device_kernel
          
          echo "==== 1. 修复高版本 Clang 编译老内核的通病 ===="
          sed -i '1i #include <asm/insn.h>' arch/arm64/kernel/module-plts.c
          sed -i '1i struct cs_target { const char *name; char *cpus; };' kernel/cgroup/cpuset.c

          echo "==== 2. 修复 cgroup 函数名拼写错误 ===="
          sed -i 's/write_wrapper/write/g' kernel/sched/tune.c

          echo "==== 3. 修复 focaltech 屏幕指纹驱动残缺 (缺失变量与空壳函数) ===="
          sed -i '/int aod_status;/a \    bool fod_finger_skip; int fod_down_time; bool point_id_changed; int fod_status; bool finger_in_fod; int fod_x; int fod_y;' drivers/input/touchscreen/focaltech_touch/focaltech_core.h
          sed -i '1i int fts_fod_reg_write(void *client, int reg, int val) { return 0; }' drivers/input/touchscreen/focaltech_touch/focaltech_core.c

          echo "==== 4. 修复 mmc 存储驱动缺失的 BKOPS 检测函数 ===="
          sed -i 's/mmc_card_doing_bkops(card)/0/g' drivers/mmc/core/core.c

          echo "==== 5. 修复 namei.c 中未声明的 error 变量 ===="
          sed -i '3168s/^/    int error = 0; \/* FIXED_UNDECLARED_VAR *\/ \n/' fs/namei.c

          echo "==== 6. 修复 cpu.c 中的宏定义与掩码错误 ===="
          sed -i 's/#if CONFIG_LITTLE_CPU_MASK/#ifdef CONFIG_LITTLE_CPU_MASK/g' kernel/cpu.c
          sed -i 's/#if CONFIG_BIG_CPU_MASK/#ifdef CONFIG_BIG_CPU_MASK/g' kernel/cpu.c
          sed -i 's/#if CONFIG_PRIME_CPU_MASK/#ifdef CONFIG_PRIME_CPU_MASK/g' kernel/cpu.c
          sed -i 's/CONFIG_LITTLE_CPU_MASK/0x3F/g' kernel/cpu.c
          sed -i 's/CONFIG_BIG_CPU_MASK/0x40/g' kernel/cpu.c
          sed -i 's/CONFIG_PRIME_CPU_MASK/0x80/g' kernel/cpu.c
          sed -i 's/#ifdef 0x/#if 0x/g' kernel/cpu.c

          echo "==== 7. 修复 sdhci.c 缺失的底层信号函数 ===="
          sed -i 's|//\* void sdhci_set_uhs_signaling|#if 0\nvoid sdhci_set_uhs_signaling|g' drivers/mmc/host/sdhci.c
          sed -i 's|EXPORT_SYMBOL_GPL(sdhci_set_uhs_signaling); \*//|EXPORT_SYMBOL_GPL(sdhci_set_uhs_signaling);\n#endif|g' drivers/mmc/host/sdhci.c
          echo 'void sdhci_set_uhs_signaling(struct sdhci_host *host, unsigned timing) {}' >> drivers/mmc/host/sdhci.c
          echo 'EXPORT_SYMBOL_GPL(sdhci_set_uhs_signaling);' >> drivers/mmc/host/sdhci.c

          echo "==== 8. 修复 tcp_ipv4.c/ipv6.c 中 MPTCP 引入的幽灵 static 语法错误 ===="
          perl -0777 -pi -e 's/#ifndef CONFIG_MPTCP\s+static\s+#endif\s+const struct tcp_request_sock_ops tcp_request_sock_ipv4_ops/#ifndef CONFIG_MPTCP\n\n#endif\nconst struct tcp_request_sock_ops tcp_request_sock_ipv4_ops/g' net/ipv4/tcp_ipv4.c
          perl -0777 -pi -e 's/#ifndef CONFIG_MPTCP\s+static\s+#endif\s+const struct tcp_request_sock_ops tcp_request_sock_ipv6_ops/#ifndef CONFIG_MPTCP\n\n#endif\nconst struct tcp_request_sock_ops tcp_request_sock_ipv6_ops/g' net/ipv6/tcp_ipv6.c

          echo "==== 9. 修复 LZ4/ZSTD 压缩算法的幽灵导出与 fallthrough 报错 ===="
          sed -i '/EXPORT_SYMBOL(LZ4_decompress_safe_partial);/d' lib/lz4/lz4_decompress.c
          sed -i '/EXPORT_SYMBOL(LZ4_setStreamDecode);/d' lib/lz4/lz4_decompress.c
          sed -i '/EXPORT_SYMBOL(LZ4_decompress_safe_continue);/d' lib/lz4/lz4_decompress.c
          sed -i '/EXPORT_SYMBOL(LZ4_decompress_fast_continue);/d' lib/lz4/lz4_decompress.c
          sed -i '/EXPORT_SYMBOL(LZ4_decompress_safe_usingDict);/d' lib/lz4/lz4_decompress.c
          sed -i '/EXPORT_SYMBOL(LZ4_decompress_fast_usingDict);/d' lib/lz4/lz4_decompress.c
          sed -i 's/define ZSTD_FALLTHROUGH fallthrough/define ZSTD_FALLTHROUGH __attribute__((__fallthrough__))/g' lib/zstd/common/compiler.h

          echo "==== 10. 强杀模块版本校验 (MODVERSIONS) 以适配 LLD ===="
          find arch/arm64/configs -type f -exec sed -i 's/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/g' {} +

          echo "==== 11. 填补 madvise.c 缺失的 reclaim_pages 躯壳 ===="
          echo 'unsigned long reclaim_pages(struct list_head *page_list) { return 0; }' >> mm/madvise.c

          echo "==== 12. 从 Makefile 抹除无用的 DVB 数字电视模块以防报错 ===="
          sed -i '/mpq-dmx-hw-plugin/d' drivers/media/platform/msm/dvb/demux/Makefile

          echo "✅ 全局终极物理修复补丁已全部严格注入完毕！"

      - name: 🛠️ 强行注入 pstore 抓错机制 (温柔追加版)
        run: |
          cd device_kernel
          
          echo "==== 1. 强行打开 defconfig 开关 ===="
          DEF_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          {
            echo ""
            echo "# PSTORE DEBUG CONFIG"
            echo "CONFIG_PSTORE=y"
            echo "CONFIG_PSTORE_CONSOLE=y"
            echo "CONFIG_PSTORE_PMSG=y"
            echo "CONFIG_PSTORE_RAM=y"
          } >> "$DEF_FILE"
          echo "✅ 开关已强行写入 $DEF_FILE"

          echo "==== 2. 强行给 lito 设备树划拨 ramoops 内存 ===="
          LITO_DTS=$(find arch/arm64/boot/dts/ -name "lito.dtsi" | head -n 1)
          
          if [ -n "$LITO_DTS" ]; then
              cat << 'EOF' >> "$LITO_DTS"

          / {
              reserved-memory {
                  ramoops_mem: ramoops@a0000000 {
                      compatible = "ramoops";
                      reg = <0x0 0xa0000000 0x0 0x200000>;
                      record-size = <0x40000>;
                      console-size = <0x40000>;
                      pmsg-size = <0x40000>;
                  };
              };
          };
          EOF
              echo "✅ 成功在 DTS 文件末尾追加保留内存！"
          else
              echo "❌ 找不到 lito.dtsi 文件！"
              exit 1
          fi

      # 🚨🚨🚨 【未来科技区】已被封印 🚨🚨🚨
      # - name: 💉 强行剥离自带旧版，植入纯血 SuKiSU 2.0.0
      #   run: |
      #     cd device_kernel
      #     echo "==== 1. 物理切除原作者自带的 KernelSU 肿瘤 ===="

      # 🚨🚨🚨 【旧日封存区】：你之前手搓的验证、修复和打孔脚本，已全部加 # 物理封印，一字未删！🚨🚨🚨
      
      # - name: ⏪ 物理时光机：精准回溯 3 号提交
      #   shell: bash
      #   run: |
      #     echo "==== 启动 Git 级时光机，直接回退 ===="

      # 【以下三个额外模块为了纯净测试，暂且封印，测试完可解封】
      # - name: 🧰 Patch Kernel of Re:Kernel
      #   uses: ./.github/workflows/patch-rekernel

      # - name: 🔒 Patch Kernel of Baseband Guard
      #   uses: ./.github/workflows/patch-baseband-guard

      # - name: 🔧 Patch Hide Stuff
      #   uses: ./.github/workflows/patch-hide-stuff
          
      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
