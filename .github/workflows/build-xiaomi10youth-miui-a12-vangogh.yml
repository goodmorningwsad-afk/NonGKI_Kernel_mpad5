name: Build Xiaomi 10 Youth (vangogh) (SukiSU + SuSFS 2.0.0)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "Xiaomi 10 Youth"
  DEVICE_CODENAME : "vangogh"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 PYTHON=/usr/bin/python2"

  KERNEL_SOURCE : "https://github.com/furkancakmak34x/kernel_xiaomi_sm7250.git"
  KERNEL_BRANCH : "yuragi"

  CLANG_SOURCE : "https://github.com/ZyCromerZ/Clang/releases/download/12.0.1-20230207-release/Clang-12.0.1-20230207.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "milito_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false
  
  SUSFS_UPDATE : "true"
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "true" 
  KERNELSU_AUTO_FORK : "sukisu" 
  SUSFS_ENABLE : "true"
  SUSFS_FIXED : ""
 
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : "true"
  NEED_SAFE_DTBO : "true"
  ROM_TEXT : "miui_a12"
  PYTHON_VERSION: "2" 
  PACK_METHOD: "Anykernel3" 
  
  KERNELSU_METHOD: "shell" 

  PATCHES_SOURCE: "" 
  PATCHES_BRANCH: "" 
  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: ""
  REKERNEL_ENABLE: "true" 

  HOOK_METHOD: "syscall" 
  HOOK_OLDER: "false" 

  KERNEL_PATCH: "true" 

  KPM_ENABLE: "true" 
  KPM_INLINE: "false" 
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" 

  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false" 
  HIDE_STUFF: "false" 

  GENERATE_DTB: "true" 
  GENERATE_CHIP: "qcom" 

  BUILD_DEBUGGER: "true" 
  SKIP_PATCH: "false" 

  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true" 

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🚑 提取案发现场物证 (打孔崩溃时强制触发)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Crime_Scene_Files
          path: |
            device_kernel/fs/namei.c
            device_kernel/**/*.rej

      - name: 🩹 Fix Kernel Bugs & Extra Options
        run: |
          set -e
          cd $GITHUB_WORKSPACE/device_kernel
          
          if [ -f ".kernel_bugs_fixed" ]; then
              echo "⏭️ 内核 Bug 已修复过，跳过！"
              exit 0
          fi

          echo "==== 1. 修复高版本 Clang 编译老内核的通病 ===="
          grep -q "<asm/insn.h>" arch/arm64/kernel/module-plts.c || sed -i '1i #include <asm/insn.h>' arch/arm64/kernel/module-plts.c
          
          echo "==== 2. 修复 cgroup 函数名拼写错误 ===="
          sed -i '/\.write_/s/write_wrapper/write/g' kernel/sched/tune.c
          sed -i 's/boost_write_wrapper(/__attribute__((unused)) boost_write_wrapper(/g' kernel/sched/tune.c
          sed -i 's/prefer_idle_write_wrapper(/__attribute__((unused)) prefer_idle_write_wrapper(/g' kernel/sched/tune.c
          
          echo "==== 3. 抹除 NTFS3 驱动超前参数 ===="
          [ -f fs/ntfs3/Makefile ] && sed -i 's/-Wunused-but-set-variable//g' fs/ntfs3/Makefile
          [ -f fs/ntfs3/Makefile ] && sed -i 's/-Wno-unused-but-set-variable//g' fs/ntfs3/Makefile
          
          echo "==== 4. 物理补全 namei.c 变量声明 ===="
          grep -q "FIXED_UNDECLARED_VAR" fs/namei.c || sed -i '3168s/^/    int error = 0; \/* FIXED_UNDECLARED_VAR *\/ \n/' fs/namei.c
          
          echo "==== 5. 拯救 namespace.c ===="
          grep -q "LineageOS restored" fs/namespace.c || {
              curl -LSs "https://raw.githubusercontent.com/LineageOS/android_kernel_xiaomi_sm7250/lineage-22.1/fs/namespace.c" -o fs/namespace.c
              echo "// LineageOS restored" >> fs/namespace.c
          }

          echo "==== 6. 防止 LTO 爆内存，强制保留 ===="
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' arch/arm64/configs/milito_defconfig
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/milito_defconfig

          touch .kernel_bugs_fixed

      - name: 🩹 Fix SukiSU Bugs & Defconfig Options
        run: |
          set -e
          cd $GITHUB_WORKSPACE/device_kernel
          
          if [ -f ".sukisu_bugs_fixed" ]; then
              echo "⏭️ SukiSU Bug 已修复过，跳过！"
              exit 0
          fi

          echo "==== 🎯 0. 精准锁定 SukiSU 源码大本营 ===="
          KSU_DIR=$(find $GITHUB_WORKSPACE -type d \( -name "KernelSU" -o -name "kernelsu" -o -name "SukiSU" \) -not -path "*/out/*" -not -path "*/.git/*" | head -n 1)
          
          if [ -n "$KSU_DIR" ]; then
              echo "✅ 锁定大本营：$KSU_DIR"
              
              echo "==== 1. 修复 event.c 4.19 兼容性 ===="
              EVENT_FILE=$(find "$KSU_DIR" -type f -name "event.c" | head -n 1)
              if [ -n "$EVENT_FILE" ]; then
                  sed -i 's/\bstrncpy_from_user_nofault(/__strncpy_from_user_nofault(/g' "$EVENT_FILE"
                  sed -i 's/USER_ARG_NULL, gfp/NULL, gfp/g' "$EVENT_FILE"
              fi

              echo "==== 2. 修复 adb_root.c 辅助函数注入 ===="
              ADB_ROOT=$(find "$KSU_DIR" -type f -name "adb_root.c" | head -n 1)
              if [ -n "$ADB_ROOT" ]; then
                  echo 'static inline bool susfs_starts_with(const char *str, const char *prefix) { return strncmp(str, prefix, strlen(prefix)) == 0; }' > /tmp/susfs_str_helpers.h
                  echo 'static inline bool susfs_ends_with(const char *str, const char *suffix) { int len = strlen(str); int slen = strlen(suffix); return (len >= slen) && (strcmp(str + len - slen, suffix) == 0); }' >> /tmp/susfs_str_helpers.h
                  sed -i '1i #include <linux/string.h>' "$ADB_ROOT"
                  sed -i '2r /tmp/susfs_str_helpers.h' "$ADB_ROOT"
              fi
              
              echo "==== 3. 拒绝伪造！全盘搜索并找回 SukiSU 丢失的拦截大本营 ===="
              KSU_MAIN=$(find "$KSU_DIR" -type f -name "ksu.c" | head -n 1)
              if [ -n "$KSU_MAIN" ]; then
                  echo "🔍 启动雷达，全盘扫描核心拦截文件..."
                  # 精确搜寻包含 ksu_input_hook_key_false 定义的文件（通常是 core_hook.c）
                  REAL_HOOK_FILE=$(find "$KSU_DIR" -type f -name "*.c" | xargs grep -l "ksu_input_hook_key_false" | grep -v "ksu\.c" | head -n 1 || true)
                  
                  if [ -n "$REAL_HOOK_FILE" ]; then
                      REL_PATH=${REAL_HOOK_FILE#$KSU_DIR/}
                      echo "✅ 找到了原厂核心拦截文件：$REL_PATH"
                      
                      if ! grep -q "$REL_PATH" "$KSU_MAIN"; then
                          echo "" >> "$KSU_MAIN"
                          echo "/* 物理溯源：强行接回 SukiSU 遗忘的原厂拦截开关大本营 */" >> "$KSU_MAIN"
                          echo "#include \"$REL_PATH\"" >> "$KSU_MAIN"
                          echo "✅ 已将 ($REL_PATH) 重新接回 SukiSU 心脏，满血复活！"
                      else
                          echo "⏭️ $KSU_MAIN 已经包含该文件，无需重复接入。"
                      fi
                  else
                      echo "⚠️ 警告：雷达未能在 SukiSU 源码中找到任何包含静态键的 hook 文件！如果继续报错，说明上游已彻底摧毁拦截功能。"
                  fi
              fi
          fi
          
          echo "==== 4. 开启内核配置与防线 ===="
          grep -q "\-Wno-unused-function" fs/Makefile || echo "ccflags-y += -Wno-unused-function" >> fs/Makefile
          grep -q "\-Wno-error" fs/Makefile || echo "ccflags-y += -Wno-error" >> fs/Makefile
          grep -q "CONFIG_KSU_MANUAL_HOOK=y" arch/arm64/configs/milito_defconfig || echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/milito_defconfig
          sed -i 's/# CONFIG_USER_NS is not set/CONFIG_USER_NS=y/g' arch/arm64/configs/milito_defconfig
          sed -i 's/# CONFIG_SECCOMP is not set/CONFIG_SECCOMP=y/g' arch/arm64/configs/milito_defconfig
          sed -i 's/# CONFIG_SECCOMP_FILTER is not set/CONFIG_SECCOMP_FILTER=y/g' arch/arm64/configs/milito_defconfig
          grep -q "^CONFIG_SECCOMP=y" arch/arm64/configs/milito_defconfig || echo "CONFIG_SECCOMP=y" >> arch/arm64/configs/milito_defconfig
          grep -q "^CONFIG_SECCOMP_FILTER=y" arch/arm64/configs/milito_defconfig || echo "CONFIG_SECCOMP_FILTER=y" >> arch/arm64/configs/milito_defconfig

          touch .sukisu_bugs_fixed

      - name: 🪝 呼叫 SuSFS 幻影打孔外挂 (含 .rej 冲突收集)
        uses: ./.github/workflows/patch-susfs-new

      - name: 🔎 战前雷达全盘扫描 (防盲人摸象)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          KSU_DIR=$(find . -type d \( -name "KernelSU" -o -name "kernelsu" -o -name "SukiSU" \) -not -path "*/out/*" -not -path "*/.git/*" | head -n 1)
          if [ -n "$KSU_DIR" ]; then
              echo "==== SukiSU 目录文件全览 ===="
              find "$KSU_DIR" -type f | sort > SukiSU_File_Tree.txt
              cat SukiSU_File_Tree.txt
              
              echo "==== ksu.c 头文件包含详情 ===="
              grep -n "#include" "$KSU_DIR/ksu.c" > ksu_includes.txt
              cat ksu_includes.txt
          else
              echo "❌ 找不到 SukiSU 目录"
          fi

      - name: 📦 上传雷达扫描报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SukiSU_Radar_Scan
          path: |
            device_kernel/SukiSU_File_Tree.txt
            device_kernel/ksu_includes.txt

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files

      - name: 🕵️‍♂️ 现场证据上传 (出错时强制执行)
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/SukiSU_Suspects
          KSU_DIR=$(find $GITHUB_WORKSPACE -type d \( -name "KernelSU" -o -name "kernelsu" -o -name "SukiSU" \) -not -path "*/out/*" -not -path "*/.git/*" | head -n 1)
          if [ -n "$KSU_DIR" ]; then
              find "$KSU_DIR" -name "sucompat.c" -exec cp {} $GITHUB_WORKSPACE/SukiSU_Suspects/ \; || true
              find "$KSU_DIR" -name "sucompat.h" -exec cp {} $GITHUB_WORKSPACE/SukiSU_Suspects/ \; || true
              find "$KSU_DIR" -name "su_mount_ns.c" -exec cp {} $GITHUB_WORKSPACE/SukiSU_Suspects/ \; || true
              find "$KSU_DIR" -name "allowlist.c" -exec cp {} $GITHUB_WORKSPACE/SukiSU_Suspects/ \; || true
              find "$KSU_DIR" -name "syscall_handler.c" -exec cp {} $GITHUB_WORKSPACE/SukiSU_Suspects/ \; || true
              cd $GITHUB_WORKSPACE/SukiSU_Suspects && zip -r ../SukiSU_Evidence.zip . || true
          fi
      - name: 📦 上传物证包
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SukiSU_Evidence
          path: SukiSU_Evidence.zip
