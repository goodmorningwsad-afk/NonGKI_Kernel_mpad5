name: Build Xiaomi 10 Youth (vangogh) (MIUI A12)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "Xiaomi 10 Youth"
  DEVICE_CODENAME : "vangogh"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  # 强制使用 python2 以兼容 Ubuntu 20.04 和 Proton Clang 编译链
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 PYTHON=/usr/bin/python2"

  KERNEL_SOURCE : "https://github.com/goodmorningwsad-afk/kernel_xiaomi_sm7250zoom"
  KERNEL_BRANCH : "yuragi"

  # 采用带 binutils 的 Proton Clang，免去 GCC 烦恼，适配老内核最稳
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  # 如果编译提示找不到 defconfig，可以尝试改为 vendor/xiaomi/picasso_defconfig
  DEFCONFIG_NAME : "vendor/vangogh_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : "sukisu"

  # 开启 SUSFS 编译
  SUSFS_ENABLE : "false"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : "false"
  NEED_SAFE_DTBO : "false"

  ROM_TEXT : "miui_a12"

  # Ubuntu 20.04 (focal) 默认支持 python2
  PYTHON_VERSION: "2"

  PACK_METHOD: "Anykernel3"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"

  # 手动挂载点：选择文档推荐的最小化修补方式 syscall
  HOOK_METHOD: "syscall"
  HOOK_OLDER: "false"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  # 开启报错日志输出，方便法医级查证
  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    # 🚨 极客核心预警：使用 Proton Clang 必须配合 Ubuntu 20.04 容器！
    container: ubuntu:focal 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: ⏪ 物理时光机：精准回溯 SukiSU 源码 (剥离最新带病代码)
        shell: bash
        run: |
          echo "==== 启动 Git 级时光机，锁定 SukiSU 纯净版 ===="
          
          # 精准定位刚才拉取下来的 SukiSU 源码根目录
          KSU_DIR=$(find $GITHUB_WORKSPACE -type d \( -name "KernelSU" -o -name "KernelSU-Next" \) -not -path "*/out/*" | head -n 1)
          
          if [ -n "$KSU_DIR" ]; then
              echo "🔍 成功锁定 SukiSU 大本营: $KSU_DIR"
              cd "$KSU_DIR"
              
              # 🚨 加入强制拉取深度，完美解决 unknown revision 报错！
              echo "==== 🚨 突破子模块浅克隆限制，拉取时空记录 ===="
              git fetch --depth=150 || git fetch --unshallow
              
              # 核心指令：直接硬重置到已知无毒、不报错的纯净提交 (c1fd51c)
              git reset --hard c1fd51c
              
              echo "✅ SukiSU 源码已成功回溯至纯净版！"
          else
              echo "❌ 致命错误：未找到 SukiSU 源码目录，时光机启动失败！"
              exit 1
          fi

      - name: 🩹 物理开颅：修复 SukiSU 遗留的 C 语言语法错误
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "==== 开始修复 SukiSU 原厂代码结构 Bug ===="
          
          # 1. 修复 app_profile.c 的指针调用笔误 (profile-> 改为 profile.)
          sed -i 's/profile->selinux_domain/profile.selinux_domain/g' drivers/kernelsu/app_profile.c
          sed -i 's/newcreds\./newcreds->/g' drivers/kernelsu/app_profile.c
          # 精准替换后半段代码，防误伤
          sed -i '300,$s/, cred)/, newcreds)/g' drivers/kernelsu/app_profile.c
          
          # 2. 修复 supercalls.c 的宏定义套娃与链接报错
          sed -i 's/KSU_IOCTL(KSU_IOCTL_NEW_GET_ALLOW_LIST/KSU_IOCTL(NEW_GET_ALLOW_LIST/g' drivers/kernelsu/supercalls.c
          sed -i 's/KSU_IOCTL(KSU_IOCTL_NEW_GET_DENY_LIST/KSU_IOCTL(NEW_GET_DENY_LIST/g' drivers/kernelsu/supercalls.c
          sed -i '/ksu_mark_running_process/d' drivers/kernelsu/supercalls.c
          
          # 3. 修复 sucompat.c 致命的安全掉包漏洞
          echo "==== 正在切断 su->sh 的无差别篡改大动脉 ===="
          sed -i 's/ksu_strncpy_from_user_nofault(path, \*filename_user, sizeof(path));/if (!is_su_allowed()) return 0;\n\tksu_strncpy_from_user_nofault(path, \*filename_user, sizeof(path));/g' drivers/kernelsu/sucompat.c
          
          echo "✅ SukiSU 核心病灶与语法报错已全部物理切除！"

      - name: 🪄 唤醒 SuSFS 2.0.0 大动脉 (纯净注入)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "==== 1. 唤醒 SuSFS 2.0.0 核心开关 ===="
          DEFCONFIG_FILE="arch/arm64/configs/$DEFCONFIG_NAME"
          if [ ! -f "$DEFCONFIG_FILE" ]; then
              echo "⚠️ 找不到 $DEFCONFIG_FILE，尝试备用路径 picasso_defconfig"
              DEFCONFIG_FILE="arch/arm64/configs/vendor/xiaomi/picasso_defconfig"
          fi
          
          cat << 'EOF' >> "$DEFCONFIG_FILE"
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_USER_NS=y
          CONFIG_KSU_MANUAL_HOOK=y
          EOF
          
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' "$DEFCONFIG_FILE"
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' "$DEFCONFIG_FILE"
          
          echo "==== [防漂移装甲] 修正 SukiSU 验证逻辑 ===="
          sed -i '/ksu_load_allow_list();/a \	track_throne(false);' drivers/kernelsu/ksud.c
          sed -i 's/if (has_v1_signing)/if (0)/g' drivers/kernelsu/apk_sign.c
          sed -i 's/if (v3_signing_exist || v3_1_signing_exist)/if (0)/g' drivers/kernelsu/apk_sign.c

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs-new

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel
          # 此处预留给你以后手工打孔的位置（如果 NonGKI 自带的 patch 失败的话）

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
