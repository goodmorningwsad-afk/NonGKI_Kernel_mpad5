name: Build Xiaomi 10 Youth (vangogh) (MIUI A12)

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME : "Xiaomi 10 Youth"
  DEVICE_CODENAME : "vangogh"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 PYTHON=/usr/bin/python2"

  KERNEL_SOURCE : "https://github.com/LineageOS/android_kernel_xiaomi_sm7250"
  KERNEL_BRANCH : "lineage-22.1"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/lito-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : "sukisu"
  SUSFS_ENABLE : "false"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : "false"
  NEED_SAFE_DTBO : "false"
  ROM_TEXT : "miui_a12"
  PYTHON_VERSION: "2"
  PACK_METHOD: "Anykernel3"
  KERNELSU_METHOD: "none"
  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "none"
  HOOK_OLDER: "false"
  KERNEL_PATCH: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"
  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    container: ubuntu:focal 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 📦 Extract Pristine Source Code (Before Patching)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "==== 正在提取案发现场绝对纯净的原厂源码 ===="
          # 将所有嫌疑文件打包成一个 zip
          zip -r pristine_sources.zip \
            fs/namespace.c \
            fs/namei.c \
            kernel/cgroup/cpuset.c \
            kernel/cpu.c \
            kernel/sched/tune.c \
            arch/arm64/kernel/module-plts.c \
            lib/lz4/lz4_decompress.c \
            net/ipv4/tcp_ipv4.c \
            net/ipv6/tcp_ipv6.c \
            lib/zstd/common/compiler.h \
            drivers/input/touchscreen/focaltech_touch/focaltech_core.h \
            drivers/input/touchscreen/focaltech_touch/focaltech_core.c \
            drivers/mmc/core/core.c \
            mm/madvise.c \
            drivers/mmc/host/sdhci.c
            
      - name: 📤 Upload Pristine Sources Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pristine_kernel_sources
          path: device_kernel/pristine_sources.zip

      - name: 🪛 Extra Kernel Options (Safe Mode)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          apply_patch() {
              local name="$1"; local file="$2"; local mode="$3"; local marker="$4"; local func="$5"
              echo "🔍 检查补丁: [$name] -> $file"
              if [ "$mode" = "has" ] && grep -Fq "$marker" "$file"; then return 0; fi
              if [ "$mode" = "no" ] && ! grep -Fq "$marker" "$file"; then return 0; fi
              echo "🔨 正在执行外科手术..."
              $func
              if [ "$mode" = "has" ] && grep -Fq "$marker" "$file"; then echo "✅ [成功]"; return 0; fi
              if [ "$mode" = "no" ] && ! grep -Fq "$marker" "$file"; then echo "✅ [成功]"; return 0; fi
              echo "❌ [致命错误] $file"
              exit 1
          }
          
          # 1. 仅保留最基础的语法和编译报错修复，绝不碰核心逻辑！
          patch_module_plts() { sed -i '1i #include <asm/insn.h> \/* FIXED_MODULE_PLTS *\/' arch/arm64/kernel/module-plts.c; }
          patch_cpuset() { sed -i '1i struct cs_target { const char *name; char *cpus; }; \/* FIXED_CS_TARGET *\/' kernel/cgroup/cpuset.c; }
          patch_lz4() { sed -i '/EXPORT_SYMBOL(LZ4_decompress_safe_partial);/d' lib/lz4/lz4_decompress.c; sed -i '/EXPORT_SYMBOL(LZ4_setStreamDecode);/d' lib/lz4/lz4_decompress.c; sed -i '/EXPORT_SYMBOL(LZ4_decompress_safe_continue);/d' lib/lz4/lz4_decompress.c; sed -i '/EXPORT_SYMBOL(LZ4_decompress_fast_continue);/d' lib/lz4/lz4_decompress.c; sed -i '/EXPORT_SYMBOL(LZ4_decompress_safe_usingDict);/d' lib/lz4/lz4_decompress.c; sed -i '/EXPORT_SYMBOL(LZ4_decompress_fast_usingDict);/d' lib/lz4/lz4_decompress.c; }
          patch_sdhci() { sed -i 's|//\* void sdhci_set_uhs_signaling|/* FIXED_SDHCI */ void sdhci_set_uhs_signaling|g' drivers/mmc/host/sdhci.c; sed -i 's|EXPORT_SYMBOL_GPL(sdhci_set_uhs_signaling); \*//|EXPORT_SYMBOL_GPL(sdhci_set_uhs_signaling);|g' drivers/mmc/host/sdhci.c; }
          patch_dvb() { sed -i 's/CONFIG_DVB_MPQ=m/# CONFIG_DVB_MPQ is not set/g' arch/arm64/configs/vendor/lito-perf_defconfig; sed -i 's/CONFIG_DVB_MPQ_DEMUX=m/# CONFIG_DVB_MPQ_DEMUX is not set/g' arch/arm64/configs/vendor/lito-perf_defconfig; echo "# CONFIG_DVB_MPQ is not set /* FIXED_DVB_CONFIG */" >> arch/arm64/configs/vendor/lito-perf_defconfig; if [ -d "drivers/media/platform/msm/dvb" ]; then find drivers/media/platform/msm/dvb -name "Makefile" -type f -exec sed -i 's/obj-$(CONFIG/DISABLED_obj-$(CONFIG/g' {} +; find drivers/media/platform/msm/dvb -name "Makefile" -type f -exec sed -i 's/obj-m/DISABLED_obj-m/g' {} +; find drivers/media/platform/msm/dvb -name "Makefile" -type f -exec sed -i 's/obj-y/DISABLED_obj-y/g' {} +; fi; }
          
          # 2. 贯彻你的意志：只关掉干扰的宏，物理切除 LLVM 报错，绝对保留原厂模块校验逻辑！
          patch_minimal_survival() {
              sed -i '/CONFIG_MODVERSIONS/d' arch/arm64/configs/vendor/lito-perf_defconfig
              echo "CONFIG_MODVERSIONS=y /* FIXED_MODVERSIONS */" >> arch/arm64/configs/vendor/lito-perf_defconfig
              find include arch/arm64 -name "export.h" -type f -exec sed -i '/__crc_/d' {} +
              sed -i '/CONFIG_KSU/d' arch/arm64/configs/vendor/lito-perf_defconfig
              echo "# CONFIG_KSU is not set" >> arch/arm64/configs/vendor/lito-perf_defconfig
              echo "# CONFIG_KSU_SUSFS is not set" >> arch/arm64/configs/vendor/lito-perf_defconfig
          }

          apply_patch "语法修复: module-plts" arch/arm64/kernel/module-plts.c has "FIXED_MODULE_PLTS" patch_module_plts
          apply_patch "语法修复: cpuset" kernel/cgroup/cpuset.c has "FIXED_CS_TARGET" patch_cpuset
          apply_patch "语法修复: lz4" lib/lz4/lz4_decompress.c no "EXPORT_SYMBOL(LZ4_decompress_safe_partial);" patch_lz4
          apply_patch "语法修复: sdhci" drivers/mmc/host/sdhci.c has "FIXED_SDHCI" patch_sdhci
          apply_patch "切除无用盲肠: DVB" arch/arm64/configs/vendor/lito-perf_defconfig has "FIXED_DVB_CONFIG" patch_dvb
          
          # 🚨 按照你的直觉，仅执行极简保命，拔除所有 module.c 欺骗！
          apply_patch "极简保命 (消灭 LLVM 报错并闭源免疫)" arch/arm64/configs/vendor/lito-perf_defconfig has "FIXED_MODVERSIONS" patch_minimal_survival
          
          echo "ccflags-y += -Wno-error" >> Makefile
          echo "✅ 极简真理版装甲加载完毕！"
          
      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
