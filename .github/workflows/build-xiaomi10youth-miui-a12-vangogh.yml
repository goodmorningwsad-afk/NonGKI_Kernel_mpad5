name: Build Xiaomi 10 Youth (vangogh) (MIUI A12)

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME : "Xiaomi 10 Youth"
  DEVICE_CODENAME : "vangogh"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 PYTHON=/usr/bin/python2"

  KERNEL_SOURCE : "https://github.com/goodmorningwsad-afk/kernel_xiaomi_sm7250zoom"
  KERNEL_BRANCH : "yuragi"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/lito-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : "sukisu"
  SUSFS_ENABLE : "false"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : "false"
  NEED_SAFE_DTBO : "false"
  ROM_TEXT : "miui_a12"
  PYTHON_VERSION: "2"
  PACK_METHOD: "Anykernel3"
  KERNELSU_METHOD: "none"
  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "none"
  HOOK_OLDER: "false"
  KERNEL_PATCH: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"
  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    container: ubuntu:focal 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪛 Extra Kernel Options (Safe Mode)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          # ===================================================
          # 🛡️ 核心自检与防御框架：防重复、防静默失败
          # ===================================================
          apply_patch() {
              local name="$1"
              local file="$2"
              local mode="$3"
              local marker="$4"
              local func="$5"
              
              echo "---------------------------------------------------"
              echo "🔍 检查补丁: [$name] -> $file"
              
              if [ "$mode" = "has" ] && grep -Fq "$marker" "$file"; then
                  echo "⏭️  [跳过] 目标已包含补丁特征，防止重复修补。"
                  return 0
              fi
              if [ "$mode" = "no" ] && ! grep -Fq "$marker" "$file"; then
                  echo "⏭️  [跳过] 目标已清理完毕，防止重复修补。"
                  return 0
              fi
              
              echo "🔨 正在执行外科手术..."
              $func
              
              if [ "$mode" = "has" ] && grep -Fq "$marker" "$file"; then
                  echo "✅ [成功] 补丁已完美融合！"
                  return 0
              fi
              if [ "$mode" = "no" ] && ! grep -Fq "$marker" "$file"; then
                  echo "✅ [成功] 目标代码已彻底抹除！"
                  return 0
              fi
              
              echo "❌ [致命错误] 补丁应用失败！未能在 $file 中找到特征码 ($mode: $marker)。"
              exit 1
          }
          
          # ===================================================
          # 🧰 所有修补逻辑函数化 (将你的心血全部封装)
          # ===================================================
          
          patch_namei() {
              sed -i 's/struct user_namespace \*s_user_ns;/struct user_namespace \*s_user_ns;\n\tint error = 0;/g' fs/namei.c
          }
          patch_module_plts() {
              sed -i '1i #include <asm/insn.h>' arch/arm64/kernel/module-plts.c
          }
          patch_cpuset() {
              sed -i '1i struct cs_target { const char *name; char *cpus; };' kernel/cgroup/cpuset.c
          }
          patch_cpu() {
              sed -i 's/^#if CONFIG_LITTLE_CPU_MASK/#if 0 \/\* FIXED_CPU_MASK \*\//g' kernel/cpu.c
              sed -i 's/^#if CONFIG_BIG_CPU_MASK/#if 0 \/\* FIXED_CPU_MASK \*\//g' kernel/cpu.c
              sed -i 's/^#if CONFIG_PRIME_CPU_MASK/#if 0 \/\* FIXED_CPU_MASK \*\//g' kernel/cpu.c
          }
          patch_sched_tune() {
              sed -i 's/\.write_u64 = sched_boost_override_write_wrapper/.write_u64 = sched_boost_override_write/g' kernel/sched/tune.c
              sed -i 's/\.write_u64 = sched_colocate_write_wrapper/.write_u64 = sched_colocate_write/g' kernel/sched/tune.c
              sed -i 's/\.write_s64 = boost_write_wrapper/.write_s64 = boost_write/g' kernel/sched/tune.c
              sed -i 's/\.write_u64 = prefer_idle_write_wrapper/.write_u64 = prefer_idle_write/g' kernel/sched/tune.c
          }
          patch_namespace() {
              # 纳米级精准吃掉最后多余的 2 个右括号，绝不伤及后面的代码！
              perl -0777 -pi -e 's/(err = graft_tree\(mnt, parent, mp\);\s*if\s*\(err\)\s*\{\s*lock_mount_hash\(\);\s*umount_tree\(mnt, UMOUNT_SYNC\);\s*unlock_mount_hash\(\);\s*\})\s*\}\s*\}/$1\n out2:\n\tunlock_mount(mp);\n out:\n\tpath_put(\&old_path);\n\treturn err;\n}/g' fs/namespace.c
          }
          patch_lz4() {
              sed -i '/EXPORT_SYMBOL(LZ4_decompress_safe_partial);/d' lib/lz4/lz4_decompress.c
              sed -i '/EXPORT_SYMBOL(LZ4_setStreamDecode);/d' lib/lz4/lz4_decompress.c
              sed -i '/EXPORT_SYMBOL(LZ4_decompress_safe_continue);/d' lib/lz4/lz4_decompress.c
              sed -i '/EXPORT_SYMBOL(LZ4_decompress_fast_continue);/d' lib/lz4/lz4_decompress.c
              sed -i '/EXPORT_SYMBOL(LZ4_decompress_safe_usingDict);/d' lib/lz4/lz4_decompress.c
              sed -i '/EXPORT_SYMBOL(LZ4_decompress_fast_usingDict);/d' lib/lz4/lz4_decompress.c
          }
          patch_tcp() {
              perl -0777 -pi -e 's/#ifndef CONFIG_MPTCP\s*static\s*#endif/#ifndef CONFIG_MPTCP\n#endif/g' net/ipv4/tcp_ipv4.c
              perl -0777 -pi -e 's/#ifndef CONFIG_MPTCP\s*static\s*#endif/#ifndef CONFIG_MPTCP\n#endif/g' net/ipv6/tcp_ipv6.c
              sed -i 's/static const struct inet_connection_sock_af_ops ipv6_mapped;/const struct inet_connection_sock_af_ops ipv6_mapped;/g' net/ipv6/tcp_ipv6.c
              sed -i 's/static const struct inet_connection_sock_af_ops ipv6_specific;/const struct inet_connection_sock_af_ops ipv6_specific;/g' net/ipv6/tcp_ipv6.c
          }
          patch_zstd() {
              sed -i 's/#define ZSTD_FALLTHROUGH fallthrough/#define ZSTD_FALLTHROUGH __attribute__((__fallthrough__))/g' lib/zstd/common/compiler.h
          }
          patch_focaltech() {
              perl -pi -e 's/(int aod_status;)/$1\n\tbool fod_finger_skip;\n\tint fod_down_time;\n\tbool point_id_changed;\n\tint fod_status;\n\tbool finger_in_fod;\n\tint fod_x;\n\tint fod_y;/g' drivers/input/touchscreen/focaltech_touch/focaltech_core.h
              sed -i '/#include "focaltech_core.h"/a int fts_fod_reg_write(struct i2c_client *client, u8 reg, u8 value);' drivers/input/touchscreen/focaltech_touch/focaltech_core.c
              sed -i 's/fts_fod_reg_write(ts_data->client, FTS_REG_GESTURE_FOD_ON, true);/0;/g' drivers/input/touchscreen/focaltech_touch/focaltech_core.c
          }
          patch_mmc() {
              sed -i 's/mmc_card_doing_bkops(card)/0/g' drivers/mmc/core/core.c
          }
          patch_madvise() {
              sed -i 's/reclaim_pages([^)]*)/0 \/\* FIXED_RECLAIM \*\//g' mm/madvise.c
          }
          patch_sdhci() {
              sed -i 's|//\* void sdhci_set_uhs|void sdhci_set_uhs|g' drivers/mmc/host/sdhci.c
              sed -i 's|EXPORT_SYMBOL_GPL(sdhci_set_uhs_signaling); \*//|EXPORT_SYMBOL_GPL(sdhci_set_uhs_signaling);|g' drivers/mmc/host/sdhci.c
          }
          patch_modversions() {
              sed -i 's/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/g' arch/arm64/configs/vendor/lito-perf_defconfig
              echo "# CONFIG_MODVERSIONS is not set" >> arch/arm64/configs/vendor/lito-perf_defconfig
          }
          
          # ===================================================
          # 🎯 精准部署任务流水线 (全线特征码已校准)
          # ===================================================
          
          apply_patch "修补 namei.c" fs/namei.c has "int error = 0;" patch_namei
          apply_patch "修补 module-plts.c" arch/arm64/kernel/module-plts.c has "#include <asm/insn.h>" patch_module_plts
          
          # [校准]: 必须精准匹配我们注入的这一行，防止被原厂废弃代码骗过！
          apply_patch "修补 cpuset.c" kernel/cgroup/cpuset.c has "const char *name; char *cpus;" patch_cpuset
          
          apply_patch "修补 cpu.c" kernel/cpu.c has "FIXED_CPU_MASK" patch_cpu
          
          # [校准]: 将模式改为 has，只要包含替换后的新指针赋值即判定成功！
          apply_patch "修补 sched/tune.c" kernel/sched/tune.c has ".write_u64 = sched_boost_override_write" patch_sched_tune
          
          # [校准]: 匹配最新的精确闭合标签 out2:
          apply_patch "修补 namespace.c (VFS核心)" fs/namespace.c has "out2:" patch_namespace
          
          apply_patch "清理 lz4 幽灵导出" lib/lz4/lz4_decompress.c no "EXPORT_SYMBOL(LZ4_decompress_safe_partial);" patch_lz4
          apply_patch "修复 TCP 网络协议" net/ipv6/tcp_ipv6.c no "static const struct inet_connection_sock_af_ops ipv6_mapped;" patch_tcp
          apply_patch "修复 ZSTD 压缩库" lib/zstd/common/compiler.h has "__attribute__((__fallthrough__))" patch_zstd
          apply_patch "修复 小米触控屏指纹" drivers/input/touchscreen/focaltech_touch/focaltech_core.h has "bool fod_finger_skip;" patch_focaltech
          apply_patch "修复 MMC 闪存驱动" drivers/mmc/core/core.c no "mmc_card_doing_bkops(card)" patch_mmc
          apply_patch "修复 内存回收机制" mm/madvise.c has "FIXED_RECLAIM" patch_madvise
          apply_patch "修复 SDHCI 乱码注释" drivers/mmc/host/sdhci.c no "//\* void sdhci_set_uhs" patch_sdhci
          apply_patch "关闭 MODVERSIONS 强校验" arch/arm64/configs/vendor/lito-perf_defconfig has "# CONFIG_MODVERSIONS is not set" patch_modversions
          
          echo "---------------------------------------------------"
          echo "💉 注入镇静剂，屏蔽无效的编译器警告"
          echo "ccflags-y += -Wno-unused-function -Wno-error" >> mm/Makefile
          echo "ccflags-y += -Wno-unused-function -Wno-unused-variable -Wno-error" >> fs/Makefile
          echo "ccflags-y += -Wno-unused-function -Wno-error" >> kernel/Makefile
          echo "ccflags-y += -Wno-unused-function -Wno-error" >> kernel/sched/Makefile
          # [新增] 专门给 cpuset.c 所在的目录打一针，屏蔽辅助函数未使用的警告
          echo "ccflags-y += -Wno-unused-function -Wno-error" >> kernel/cgroup/Makefile
          echo "ccflags-y += -Wno-unused-variable -Wno-error" >> drivers/clk/Makefile
          echo "ccflags-y += -Wno-unused-variable -Wno-unused-function -Wno-error" >> drivers/input/touchscreen/focaltech_touch/Makefile
          echo "ccflags-y += -Wno-declaration-after-statement -Wno-error" >> drivers/leds/Makefile
          echo "ccflags-y += -Wno-shift-count-overflow -Wno-error" >> drivers/mmc/host/Makefile
          echo "ccflags-y += -Wno-logical-op-parentheses -Wno-error" >> net/ipv4/Makefile
          
          echo "✅ 极客级自检装甲加载完毕，编译护盾全开，直接通关吧！"
          
      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
