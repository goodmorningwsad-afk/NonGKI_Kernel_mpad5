name: Build Xiaomi 10 Youth (vangogh) (MIUI A12)

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME : "Xiaomi 10 Youth"
  DEVICE_CODENAME : "vangogh"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 PYTHON=/usr/bin/python2"

  KERNEL_SOURCE : "https://github.com/goodmorningwsad-afk/kernel_xiaomi_sm7250zoom"
  KERNEL_BRANCH : "yuragi"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/vangogh_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # 保持空壳参数不报错
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : "sukisu"
  SUSFS_ENABLE : "false"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : "false"
  NEED_SAFE_DTBO : "false"
  ROM_TEXT : "miui_a12"
  PYTHON_VERSION: "2"
  PACK_METHOD: "Anykernel3"
  KERNELSU_METHOD: "none"
  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "none"
  HOOK_OLDER: "false"
  KERNEL_PATCH: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"
  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    container: ubuntu:focal 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🛑 纯净度检验挂起
        run: |
          echo "========================================================"
          echo "🛡️ 当前为【绝对净化测试模式】！"
          echo "🛡️ SukiSU 与 SuSFS 注入动作已被全部物理隔离！"
          echo "🛡️ 请前往上方的 Build Environment 日志中查看核磁共振结果！"
          echo "========================================================"
