name: Build Xiaomi 10 Youth (vangogh) ( NO MIUI A12)

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME : "Xiaomi 10 Youth"
  DEVICE_CODENAME : "vangogh"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 PYTHON=/usr/bin/python2"

  # 🚨 神装大动脉：自带 KernelSU, SuSFS 1.5.5, 且极大概率修复了 Android 15 挂载
  KERNEL_SOURCE : "https://github.com/furkancakmak34x/kernel_xiaomi_sm7250.git"
  KERNEL_BRANCH : "yuragi"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/lito-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "sukisu"
  SUSFS_ENABLE : "true"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : "true"
  NEED_SAFE_DTBO : "true"
  ROM_TEXT : "miui_a12"
  PYTHON_VERSION: "2"
  PACK_METHOD: "Anykernel3"
  KERNELSU_METHOD: "shell"
  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "none"
  HOOK_OLDER: "false"
  KERNEL_PATCH: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"
  GENERATE_DTB: "true"
  GENERATE_CHIP: "qcom"
  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    container: ubuntu:focal 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🕵️ 战前侦察：检查 pstore 工人、场地与开关
        run: |
          echo "==== 开始侦察 pstore 崩溃抓取机制 ===="
          # 进入内核源码目录（根据下方封印代码的习惯推测）
          cd device_kernel || { echo "❌ 找不到内核源码目录，请检查上一步 clone 路径"; exit 1; }

          echo ">> 1. 查岗：寻找 pstore '工人' (核心代码与驱动)"
          if [ -d "fs/pstore" ] && { [ -f "fs/pstore/ram.c" ] || [ -f "fs/pstore/ram_core.c" ]; }; then
              echo "✅ '工人' 在岗：找到了 fs/pstore 核心工作组！"
          else
              echo "❌ 警告：未找到 fs/pstore/ram.c，这套内核源码可能被作者阉割了抓错功能！"
          fi

          echo ">> 2. 查场地：寻找 ramoops 保留内存"
          echo "正在 arch/arm64/boot/dts/ 目录下进行地毯式搜索..."
          if grep -rnw "arch/arm64/boot/dts/" -e "ramoops" > /dev/null; then
              echo "✅ '场地' 已批：在设备树 (DTS) 中找到了 ramoops 分配节点！"
              echo ">> 📍 具体的场地坐标如下："
              # 打印出具体在哪个 dts 文件里找到了 ramoops
              grep -rnw "arch/arm64/boot/dts/" -e "ramoops" | awk -F: '{print "   - "$1}' | sort | uniq
          else
              echo "❌ 致命警告：设备树中未找到 ramoops 内存分配！"
              echo "   (即便你开了开关，崩溃瞬间工人也会因为没有内存写日志而导致抓取失败)"
          fi

          echo ">> 3. 查指令：检查 defconfig 配置文件开关"
          # 读取你在上方 env 中定义的 DEFCONFIG_NAME 变量
          DEF_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          if [ -f "$DEF_FILE" ]; then
              echo "🔍 正在审查配置文件: $DEF_FILE"
              grep -q "CONFIG_PSTORE=y" "$DEF_FILE" && echo "✅ 开关已开: CONFIG_PSTORE=y" || echo "❌ 缺失开关: CONFIG_PSTORE=y"
              grep -q "CONFIG_PSTORE_CONSOLE=y" "$DEF_FILE" && echo "✅ 开关已开: CONFIG_PSTORE_CONSOLE=y" || echo "❌ 缺失开关: CONFIG_PSTORE_CONSOLE=y"
              grep -q "CONFIG_PSTORE_RAM=y" "$DEF_FILE" && echo "✅ 开关已开: CONFIG_PSTORE_RAM=y" || echo "❌ 缺失开关: CONFIG_PSTORE_RAM=y"
          else
              echo "❌ 找不到指定的 defconfig 文件：$DEF_FILE，请检查路径是否正确。"
          fi
          
          echo "==== 侦察结束 ===="

      - name: 🛠️ 强行注入 pstore 抓错机制 (修改配置与 DTS)
        run: |
          cd device_kernel
          
          echo "==== 1. 强行打开 defconfig 开关 ===="
          DEF_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          {
            echo ""
            echo "# PSTORE DEBUG CONFIG"
            echo "CONFIG_PSTORE=y"
            echo "CONFIG_PSTORE_CONSOLE=y"
            echo "CONFIG_PSTORE_PMSG=y"
            echo "CONFIG_PSTORE_RAM=y"
          } >> "$DEF_FILE"
          echo "✅ 开关已强行写入 $DEF_FILE"

          echo "==== 2. 强行给 lito 设备树划拨 ramoops 内存 ===="
          # 寻找 lito 的基础设备树文件
          LITO_DTS=$(find arch/arm64/boot/dts/ -name "lito.dtsi" | head -n 1)
          
          if [ -n "$LITO_DTS" ]; then
              echo "📍 找到目标设备树: $LITO_DTS"
              # 弃用危险的 sed 硬插入，改在文件末尾优雅追加扩展节点
              cat << 'EOF' >> "$LITO_DTS"

          / {
              reserved-memory {
                  ramoops_mem: ramoops@a0000000 {
                      compatible = "ramoops";
                      reg = <0x0 0xa0000000 0x0 0x200000>;
                      record-size = <0x40000>;
                      console-size = <0x40000>;
                      pmsg-size = <0x40000>;
                  };
              };
          };
          EOF
              echo "✅ 成功在 DTS 文件末尾追加 0xa0000000 内存节点，语法冲突已解除！"
          else
              echo "❌ 找不到 lito.dtsi 文件，自动打补丁失败！"
              exit 1
          fi

