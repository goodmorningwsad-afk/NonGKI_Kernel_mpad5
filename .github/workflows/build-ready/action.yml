name: 'Preparation for the official start of the compilation steps.'

runs:
  using: 'composite'
  steps:
      - name: Get Kernel (拉取内核源码)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          echo "==== 🚀 物理清场：炸掉被子模块提前占用的空壳 ===="
          rm -rf device_kernel
          
          echo "==== 📥 真正拉取源码：深度 150 以获取历史案底 ===="
          git clone --recursive "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_BRANCH }}" device_kernel --depth=150
          
          KERNEL_VERSION=$(head -n 3 device_kernel/Makefile | grep -E 'VERSION|PATCHLEVEL' | awk '{print $3}' | paste -sd '.')
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "FIRST_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $1}')" >> $GITHUB_ENV
          echo "SECOND_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $2}')" >> $GITHUB_ENV

      - name: 🚀 终极激光物理清场：强行蒸发原厂脏钩子
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "==== 1. 物理铲除老旧的 KernelSU 肿瘤 ===="
          rm -rf KernelSU kernelsu
          sed -i '/KernelSU/d' .gitmodules || true
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true
          
          echo "==== 2. 物理铲除老旧的 SuSFS 肿瘤 ===="
          rm -f fs/susfs.c fs/sus_su.c
          rm -f include/linux/susfs.h include/linux/susfs_def.h include/linux/sus_su.h
          
          echo "==== 3. 激光烧毁大动脉里的 CONFIG_KSU 宏定义 ===="
          for file in fs/exec.c fs/stat.c fs/open.c fs/read_write.c fs/namespace.c drivers/input/input.c security/selinux/hooks.c; do
              if [ -f "$file" ]; then
                  sed -i '/#ifdef CONFIG_KSU/,/#endif/d' "$file" || true
                  sed -i '/#ifdef CONFIG_KSU_SUSFS/,/#endif/d' "$file" || true
              fi
          done
          echo "✅ 基础清理执行完毕，准备移交核磁共振仪进行深层复查！"

      - name: 🕵️ 法医级全盘扫描：确认内核大动脉已绝对纯净
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "==== 🔬 启动全盘核磁共振，搜索任何 KSU/SuSFS 残留 ===="
          
          DIRTY=0
          
          echo "------------------------------------------------"
          echo "👉 1. 正在深度扫描 fs/ (文件系统) 目录..."
          grep -rnE 'CONFIG_KSU|ksu_handle|susfs' fs/ && DIRTY=1 || echo "✅ fs/ 目录极其纯净！"
          
          echo "------------------------------------------------"
          echo "👉 2. 正在深度扫描 security/ (安全拦截) 目录..."
          grep -rnE 'CONFIG_KSU|ksu_handle|susfs' security/ && DIRTY=1 || echo "✅ security/ 目录极其纯净！"
          
          echo "------------------------------------------------"
          echo "👉 3. 正在深度扫描 include/ (头文件) 目录..."
          grep -rnE 'CONFIG_KSU|ksu_handle|susfs' include/linux/ && DIRTY=1 || echo "✅ include/ 目录极其纯净！"
          
          echo "------------------------------------------------"
          echo "👉 4. 正在深度扫描 drivers/ (驱动) 目录..."
          grep -rnE 'CONFIG_KSU|ksu_handle|susfs' drivers/input/ && DIRTY=1 || echo "✅ drivers/ 目录极其纯净！"
          echo "------------------------------------------------"
          
          if [ $DIRTY -eq 1 ]; then
              echo "❌ 致命警告！核磁共振发现残留病灶！"
              echo "🩸 请立刻查看上方日志，定位漏网之鱼！"
              echo "🛑 触发自动熔断！"
              exit 1
          else
              echo "🎉 完美通关！内核大动脉已经达到 10000% 无菌纯净状态！"
          fi

      - name: 📤 提取纯净内核源文件用于精准定位
        uses: actions/upload-artifact@v4
        with:
          name: Vangogh-Kernel-Source-Files
          path: |
            device_kernel/fs/exec.c
            device_kernel/fs/open.c
            device_kernel/fs/read_write.c
            device_kernel/fs/stat.c
            device_kernel/drivers/input/input.c

      - name: Get Kernel Arch
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          if [[ -d "arch/arm64/configs" ]]; then
            echo "KERNEL_ARCH=arm64" >> $GITHUB_ENV
          else
            echo "KERNEL_ARCH=arm" >> $GITHUB_ENV
          fi

      - name: Get Packing Tools
        shell: bash
        run: |
          if [[ "${{ env.PACK_METHOD }}" == "Anykernel3" ]]; then
            cd $GITHUB_WORKSPACE/device_kernel
            if [[ -d "Anykernel3" ]]; then
              echo "Found Anykernel3 in Kernel!"
            else
              git clone "${{ env.AK3_SOURCE }}" -b "${{ env.AK3_BRANCH }}" Anykernel3 --depth=1
            fi
          elif [[ "${{ env.PACK_METHOD }}" == "MKBOOTIMG" ]] || [ "${{ env.DEFCONFIG_FROM_BOOT }}" == "true" ]; then
            cd $GITHUB_WORKSPACE
            git clone https://android.googlesource.com/platform/system/tools/mkbootimg $GITHUB_WORKSPACE/mkboottools -b main-kernel-build-2024 --depth=1
            ${{ env.CURLX }} ${{ env.BOOT_SOURCE }} $GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img
            cd device_kernel
          else
            echo "Need packing method! "
            false
          fi
          echo "PACK_METHOD=${{ env.PACK_METHOD }}" >> $GITHUB_ENV

      - name: Get DEFCONFIG
        if: env.DEFCONFIG_SOURCE != '' || env.DEFCONFIG_FROM_BOOT == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          if [[ -n "${{ env.DEFCONFIG_SOURCE }}" ]]; then
            if [[ -d "device_kernel/arch/arm64/configs" ]]; then
                ${{ env.CURLX }} ${{ env.DEFCONFIG_SOURCE }} device_kernel/arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
            else
                ${{ env.CURLX }} ${{ env.DEFCONFIG_SOURCE }} device_kernel/arch/arm/configs/${{ env.DEFCONFIG_NAME }}
            fi
          elif [[ -z "${{ env.DEFCONFIG_ORIGIN_IMAGE }}" ]]; then
            if [[ "${{ env.DEFCONFIG_FROM_BOOT }}" == "true" ]]; then
                if [[ -f "${{ env.BOOT_SOURCE }}" ]]; then
                    ${{ env.CURLX }} "${{ env.BOOT_SOURCE }}" $GITHUB_WORKSPACE/boot.img
                    $GITHUB_WORKSPACE/mkboottools/unpack_bootimg.py --boot_img $GITHUB_WORKSPACE/boot.img
                    mv $GITHUB_WORKSPACE/out/kernel $GITHUB_WORKSPACE/device_kernel/Image
                    if [[ -d "device_kernel/arch/arm64/configs" ]]; then
                        $GITHUB_WORKSPACE/device_kernel/scripts/extract-ikconfig $GITHUB_WORKSPACE/device_kernel/Image > $GITHUB_WORKSPACE/device_kernel/arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
                    else
                        $GITHUB_WORKSPACE/device_kernel/scripts/extract-ikconfig $GITHUB_WORKSPACE/device_kernel/Image > $GITHUB_WORKSPACE/device_kernel/arch/arm/configs/${{ env.DEFCONFIG_NAME }}
                    fi
                fi
            else
                ${{ env.CURLX }} "${{ env.DEFCONFIG_ORIGIN_IMAGE }}" $GITHUB_WORKSPACE/device_kernel/Image
                if [[ -d "device_kernel/arch/arm64/configs" ]]; then
                    $GITHUB_WORKSPACE/device_kernel/scripts/extract-ikconfig $GITHUB_WORKSPACE/device_kernel/Image > $GITHUB_WORKSPACE/device_kernel/arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
                else
                    $GITHUB_WORKSPACE/device_kernel/scripts/extract-ikconfig $GITHUB_WORKSPACE/device_kernel/Image > $GITHUB_WORKSPACE/device_kernel/arch/arm/configs/${{ env.DEFCONFIG_NAME }}
                fi
            fi
          fi
