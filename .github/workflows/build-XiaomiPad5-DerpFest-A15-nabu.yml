name: Build Xiaomi Pad 5 (nabu) (DerpFest A15)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "Xiaomi Pad 5"
  DEVICE_CODENAME : "nabu"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/goodmorningwsad-afk/kernel_xiaomi_nabu-ki"
  KERNEL_BRANCH : "derp15.1"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi/nabu_inflated_defconfig" 
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  # 基石既然改好了，这里放心地交给系统自动获取！
  KERNELSU_AUTO_GET : "true" 
  KERNELSU_AUTO_FORK : "sukisu" 

  SUSFS_ENABLE : false 
  SUSFS_UPDATE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : "false"
  NEED_SAFE_DTBO : "false"

  ROM_TEXT : "rom_android"

  # Other env
  PYTHON_VERSION: "3" 

  PACK_METHOD: "Anykernel3" 

  # 必须是 shell，这样它才会下载守护进程！
  KERNELSU_METHOD: "shell" 

  PATCHES_SOURCE: "author/source" 
  PATCHES_BRANCH: "branch" 

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: "" 

  REKERNEL_ENABLE: "false" 

  # 挂钩方式： tracepoint
  HOOK_METHOD: "tracepoint" 
  HOOK_OLDER: "false" 

  KERNEL_PATCH: "false" 

  KPM_ENABLE: false 
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" 

  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false" 

  HIDE_STUFF: "false" 

  GENERATE_DTB: "false" 
  GENERATE_CHIP: "qcom" 

  BUILD_DEBUGGER: "false" 
  SKIP_PATCH: "false" 

  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest 
    container: ubuntu:focal 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🐍 Install Python 2
        run: |
          sudo apt-get update || apt-get update
          sudo apt-get install -y python2 || apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python || ln -sf /usr/bin/python2 /usr/bin/python

      # 💥 终极连招 A：顺应官方文档，接通 Manual Hook
      - name: 🔌 推上官方原生 Manual Hook 电闸
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo " 正在写入 defconfig 配置..."
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_MANUAL_SU=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo " 🎯 电闸已接通，准备官方无文件原生注入！"

      # 💥 终极连招 B：严格对齐官方文档的 C 语言物理手术
      - name: 🪛 实施官方标准 C 语言底层物理缝合手术
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          python3 -c '
          import os

          def patch(file, old, new):
              if os.path.exists(file):
                  with open(file, "r") as f: data = f.read()
                  if old in data:
                      data = data.replace(old, new)
                      with open(file, "w") as f: f.write(data)
                      print(f"✅ 成功物理注入: {file}")
                  else:
                      print(f"❌ 找不到注入点: {file}")

          # 1. fs/exec.c (引入官方救命的 sucompat 兼容补丁)
          patch("fs/exec.c", "#include <linux/binfmts.h>", "#include <linux/binfmts.h>\n#if defined(CONFIG_KSU)\nextern bool ksu_execveat_hook __read_mostly;\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\nextern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif")
          patch("fs/exec.c", "return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);", "#if defined(CONFIG_KSU)\n\tint ksu_fd = AT_FDCWD;\n\tint ksu_flags = 0;\n\tvoid *ksu_argv = (void *)&argv;\n\tvoid *ksu_envp = (void *)&envp;\n\tif (unlikely(ksu_execveat_hook))\n\t\tksu_handle_execveat(&ksu_fd, &filename, ksu_argv, ksu_envp, &ksu_flags);\n\telse\n\t\tksu_handle_execveat_sucompat(&ksu_fd, &filename, ksu_argv, ksu_envp, &ksu_flags);\n#endif\n\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);")

          # 2. fs/open.c
          patch("fs/open.c", "#include \"internal.h\"", "#include \"internal.h\"\n#if defined(CONFIG_KSU)\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif")
          patch("fs/open.c", "unsigned int lookup_flags = LOOKUP_FOLLOW;", "unsigned int lookup_flags = LOOKUP_FOLLOW;\n#if defined(CONFIG_KSU)\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif")

          # 3. fs/read_write.c
          patch("fs/read_write.c", "#include <asm/unistd.h>", "#include <asm/unistd.h>\n#if defined(CONFIG_KSU)\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n#endif")
          patch("fs/read_write.c", "loff_t pos = file_pos_read(f.file);", "loff_t pos = file_pos_read(f.file);\n#if defined(CONFIG_KSU)\n\t\tstruct file *ksu_file = f.file;\n\t\tloff_t *ksu_pos = &pos;\n\t\tif (unlikely(ksu_vfs_read_hook))\n\t\t\tksu_handle_vfs_read(&ksu_file, &buf, &count, &ksu_pos);\n#endif")

          # 4. fs/stat.c 遵循：无 hook 判断，直接调用
          patch("fs/stat.c", "#include <linux/syscalls.h>", "#include <linux/syscalls.h>\n#if defined(CONFIG_KSU)\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif")
          patch("fs/stat.c", "error = vfs_fstatat(dfd, filename, &stat, flag);", "#if defined(CONFIG_KSU)\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\terror = vfs_fstatat(dfd, filename, &stat, flag);")

          # 5. drivers/input/input.c 保命安全模式
          patch("drivers/input/input.c", "MODULE_AUTHOR(\"Vojtech Pavlik <vojtech@suse.cz>\");", "MODULE_AUTHOR(\"Vojtech Pavlik <vojtech@suse.cz>\");\n#if defined(CONFIG_KSU)\nextern bool ksu_input_hook __read_mostly;\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif")
          patch("drivers/input/input.c", "if (is_event_supported(type, dev->evbit, EV_MAX)) {", "#if defined(CONFIG_KSU)\n\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n#endif\n\tif (is_event_supported(type, dev->evbit, EV_MAX)) {")
          '
          echo " 🎯 完美！原生 C 语言代码注入完毕，完全贴合官方文档！"

      # 💥 终极连招 C：防止 OOM 内存爆炸
      - name: 💊 Disable LTO to prevent OOM
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo " 正在切断 LTO 优化的电源..."
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "# CONFIG_LTO is not set" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "# CONFIG_LTO_CLANG is not set" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo " LTO 优化已彻底关闭！"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
