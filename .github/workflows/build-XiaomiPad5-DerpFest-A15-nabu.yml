name: Build Xiaomi Pad 5 (nabu) (DerpFest A15)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "Xiaomi Pad 5"
  DEVICE_CODENAME : "nabu"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/goodmorningwsad-afk/kernel_xiaomi_nabu-ki"
  KERNEL_BRANCH : "derp15.1"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi/nabu_inflated_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false
  SUSFS_UPDATE : "false"

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" 
  KERNELSU_AUTO_FORK : "sukisu" 
 
  
  SUSFS_ENABLE : "true"
  SUSFS_FIXED : "true"
 
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : "false"
  NEED_SAFE_DTBO : "false"

  ROM_TEXT : "derpfest_a15"

  PYTHON_VERSION: "2" 

  PACK_METHOD: "Anykernel3" 

  KERNELSU_METHOD: "shell" 

  PATCHES_SOURCE: "author/source" 
  PATCHES_BRANCH: "branch" 

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false" 

  HOOK_METHOD: "manual" 
  HOOK_OLDER: "false" 

  KERNEL_PATCH: "false" 

  KPM_ENABLE: "true" 
  KPM_INLINE: "true" 
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" 

  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false" 

  HIDE_STUFF: "false" 

  GENERATE_DTB: "false" 
  GENERATE_CHIP: "qcom" 

  BUILD_DEBUGGER: "true" 
  SKIP_PATCH: "true" 

  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "true" 

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest 
    container: ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 📦 提取核心源码进行验证 (包含 hooks.c)
        run: |
          cd $GITHUB_WORKSPACE
          echo "==== 正在提取 hooks.c 和 exec.c 进行验证 ===="
          
          # 创建一个临时文件夹用来存放要看的文件
          mkdir -p verify_files/security/selinux
          mkdir -p verify_files/fs
          
          # 提取免死金牌文件 hooks.c
          cp device_kernel/security/selinux/hooks.c verify_files/security/selinux/ || echo "❌ 未找到 hooks.c"
          
          # 顺手把开机传感器 exec.c 也提取出来再确认一眼
          cp device_kernel/fs/exec.c verify_files/fs/ || echo "❌ 未找到 exec.c"
          
          # 打包成 zip
          cd verify_files
          zip -r ../Kernel_Verify_Files.zip .

      - name: 📤 上传源码验证包到云端
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Verify_Files
          path: Kernel_Verify_Files.zip

      # 🚨 终极修正 2：彻底铲除 patch-no-kprobe 步骤，绝不留患！

      - name: 🩹 Fix SukiSU Source Bugs & Extra Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "==== 开始清理与修复 SukiSU 原厂 Bug ===="
          
          # 1. 毫米级精准修复 builtin 分支里的原厂笔误
          sed -i 's/profile->selinux_domain/profile.selinux_domain/g' drivers/kernelsu/app_profile.c
          sed -i 's/newcreds\./newcreds->/g' drivers/kernelsu/app_profile.c
          # 🚨 致命修正：只替换 300 行以后的 cred！绝不误伤上半部分合法的 cred 变量！
          sed -i '300,$s/, cred)/, newcreds)/g' drivers/kernelsu/app_profile.c
          
          # 2. 修复 supercalls.c 的宏定义套娃与链接报错
          sed -i 's/KSU_IOCTL(KSU_IOCTL_NEW_GET_ALLOW_LIST/KSU_IOCTL(NEW_GET_ALLOW_LIST/g' drivers/kernelsu/supercalls.c
          sed -i 's/KSU_IOCTL(KSU_IOCTL_NEW_GET_DENY_LIST/KSU_IOCTL(NEW_GET_DENY_LIST/g' drivers/kernelsu/supercalls.c
          sed -i '/ksu_mark_running_process/d' drivers/kernelsu/supercalls.c
          
          # 3. 屏蔽内核中烦人的无用函数警告
          echo "ccflags-y += -Wno-unused-function" >> fs/Makefile
          echo "ccflags-y += -Wno-error" >> fs/Makefile
          
          # 4. 防止 LTO 爆内存，并强制唤醒挂载引擎
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' arch/arm64/configs/vendor/xiaomi/nabu_inflated_defconfig
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/vendor/xiaomi/nabu_inflated_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/vendor/xiaomi/nabu_inflated_defconfig

      - name: 🛠️ 终极神级打孔 (KernelSU 非 GKI 官方标准对接)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "==== 开始运行极客法医级 Bash 缝合脚本 ===="

          patch_file() {
              local file=$1
              local search_str=$2
              local offset=$3
              local insert_code=$4
              local identifier=$5
              if grep -q "$identifier" "$file"; then
                  echo "⚠️ $file 已包含 $identifier，跳过。"
                  return
              fi
              awk -v search="$search_str" -v offset="$offset" -v code="$insert_code" '
              $0 ~ search {
                  if (offset == 0) { print code; print; }
                  else { print; count = offset; while(count > 0 && getline > 0) { print; count--; } print code; }
                  next
              }
              { print }
              ' "$file" > tmp_file && mv tmp_file "$file"
              echo "✅ 成功缝合: $file"
          }

          # 1. 缝合 fs/exec.c (精准拦截在 do_execveat_common 逻辑最开头)
          EXEC_HOOK="
          #ifdef CONFIG_KSU
          {
              extern bool ksu_execveat_hook __read_mostly;
              extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
              extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
              if (unlikely(ksu_execveat_hook))
                  ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
              else
                  ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
          }
          #endif"
          patch_file "fs/exec.c" "if (IS_ERR(filename))" 0 "$EXEC_HOOK" "ksu_execveat_hook"

          # 2. 缝合 fs/open.c (拦截在 faccessat 中)
          OPEN_HOOK="
          #ifdef CONFIG_KSU
          {
              extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
              ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          }
          #endif"
          patch_file "fs/open.c" "if (mode & ~S_IRWXO)" 0 "$OPEN_HOOK" "ksu_handle_faccessat"

          # 3. 缝合 fs/read_write.c (拦截在 vfs_read 中)
          RW_HOOK="
          #ifdef CONFIG_KSU
          {
              extern bool ksu_vfs_read_hook __read_mostly;
              extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);
              if (unlikely(ksu_vfs_read_hook))
                  ksu_handle_vfs_read(&file, &buf, &count, &pos);
          }
          #endif"
          patch_file "fs/read_write.c" "if (!(file->f_mode & FMODE_READ))" 0 "$RW_HOOK" "ksu_handle_vfs_read"

          # 4. 缝合 fs/stat.c (拦截在 vfs_statx 中)
          STAT_HOOK="
          #ifdef CONFIG_KSU
          {
              extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
              ksu_handle_stat(&dfd, &filename, &flags);
          }
          #endif"
          patch_file "fs/stat.c" "if ((flags & ~(AT_SYMLINK_NOFOLLOW" 0 "$STAT_HOOK" "ksu_handle_stat"

          # 5. 缝合 drivers/input/input.c (安全模式防砖监听)
          INPUT_HOOK="
          #ifdef CONFIG_KSU
          {
              extern bool ksu_input_hook __read_mostly;
              extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
              if (unlikely(ksu_input_hook))
                  ksu_handle_input_handle_event(&type, &code, &value);
          }
          #endif"
          patch_file "drivers/input/input.c" "if (disposition != INPUT_IGNORE_EVENT && type != EV_SYN)" 0 "$INPUT_HOOK" "ksu_handle_input_handle_event"

          # 6. 缝合 fs/devpts/inode.c (严格遵循官方规范，修复哑巴终端)
          DEVPTS_HOOK="
          #ifdef CONFIG_KSU
          {
              extern int ksu_handle_devpts(struct inode*);
              ksu_handle_devpts(dentry->d_inode);
          }
          #endif"
          patch_file "fs/devpts/inode.c" "if (dentry->d_sb->s_magic != DEVPTS_SUPER_MAGIC)" 0 "$DEVPTS_HOOK" "ksu_handle_devpts"

          echo "==== 7. 正在复活 path_umount 模块神技 ===="
          if ! grep -q "path_umount" fs/namespace.c; then
              cat << 'EOF' >> fs/namespace.c

          static int can_umount(const struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);
              if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
                  return -EINVAL;
              if (!may_mount())
                  return -EPERM;
              if (path->dentry != path->mnt->mnt_root)
                  return -EINVAL;
              if (!check_mnt(mnt))
                  return -EINVAL;
              if (mnt->mnt.mnt_flags & MNT_LOCKED) /* Check optimistically */
                  return -EINVAL;
              if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
                  return -EPERM;
              return 0;
          }

          int path_umount(struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);
              int ret;
              ret = can_umount(path, flags);
              if (!ret)
                  ret = do_umount(mnt, flags);
              dput(path->dentry);
              mntput_no_expire(mnt);
              return ret;
          }
          EOF
              echo "✅ fs/namespace.c (path_umount) 追加完成！"
          else
              echo "⚠️ fs/namespace.c 已存在 path_umount，跳过。"
          fi

          echo "==== 8. 缝合 security/selinux/hooks.c (终极双重免死金牌) ===="
          HOOKS_PATCH="
          #ifdef CONFIG_KSU
          /* KSU_SELINUX_BYPASS_UNIVERSAL */
          {
              static u32 ksu_sid;
              if(!ksu_sid){
                  security_secctx_to_secid(\"u:r:su:s0\", strlen(\"u:r:su:s0\"), &ksu_sid);
              }
              if(new_tsec->sid == ksu_sid){
                  return 0;
              }
          }
          #endif"
          patch_file "security/selinux/hooks.c" "if (!nnp && !nosuid)" 0 "$HOOKS_PATCH" "KSU_SELINUX_BYPASS_UNIVERSAL"
          patch_file "security/selinux/hooks.c" "return 0; /* No change in credentials */" 1 "$HOOKS_PATCH" "KSU_SELINUX_BYPASS_UNIVERSAL"
          
          echo "✅ SELinux hooks.c 双重免死金牌追加完成！"
          
      - name: 📤 提取并打包已打孔的源码 (用于人工审查)
        run: |
          cd $GITHUB_WORKSPACE
          echo "==== 正在收集打孔后的核心文件 ===="
          mkdir -p patched_source_files/fs/devpts
          mkdir -p patched_source_files/drivers/input
          mkdir -p patched_source_files/security/selinux  # 👈 新增：创建目标文件夹
          
          # 复制打过孔的文件
          cp device_kernel/fs/exec.c patched_source_files/fs/ || true
          cp device_kernel/fs/open.c patched_source_files/fs/ || true
          cp device_kernel/fs/read_write.c patched_source_files/fs/ || true
          cp device_kernel/fs/stat.c patched_source_files/fs/ || true
          cp device_kernel/fs/namespace.c patched_source_files/fs/ || true
          cp device_kernel/fs/devpts/inode.c patched_source_files/fs/devpts/ || true
          cp device_kernel/drivers/input/input.c patched_source_files/drivers/input/ || true
          cp device_kernel/security/selinux/hooks.c patched_source_files/security/selinux/ || true # 👈 新增：把 hooks.c 拿出来
          
          cd patched_source_files
          zip -r ../Patched_Source_Files.zip .

      - name: 📦 上传打孔后源码验证包
        uses: actions/upload-artifact@v4
        with:
          name: Patched_Source_Files
          path: Patched_Source_Files.zip

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
