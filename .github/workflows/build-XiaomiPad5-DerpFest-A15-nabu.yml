name: Build Xiaomi Pad 5 (nabu) (DerpFest A15)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "Xiaomi Pad 5"
  DEVICE_CODENAME : "nabu"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/goodmorningwsad-afk/kernel_xiaomi_nabu-ki"
  KERNEL_BRANCH : "derp15.1"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi/nabu_inflated_defconfig" 
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  # 基石既然改好了，这里放心地交给系统自动获取！
  KERNELSU_AUTO_GET : "true" 
  KERNELSU_AUTO_FORK : "sukisu" 

  SUSFS_ENABLE : false 
  SUSFS_UPDATE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : "false"
  NEED_SAFE_DTBO : "false"

  ROM_TEXT : "rom_android"

  # Other env
  PYTHON_VERSION: "3" 

  PACK_METHOD: "Anykernel3" 

  # 必须是 shell，这样它才会下载守护进程！
  KERNELSU_METHOD: "shell" 

  PATCHES_SOURCE: "author/source" 
  PATCHES_BRANCH: "branch" 

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: "" 

  REKERNEL_ENABLE: "false" 

  # 挂钩方式： tracepoint
  HOOK_METHOD: "tracepoint" 
  HOOK_OLDER: "false" 

  KERNEL_PATCH: "false" 

  KPM_ENABLE: false 
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" 

  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false" 

  HIDE_STUFF: "false" 

  GENERATE_DTB: "false" 
  GENERATE_CHIP: "qcom" 

  BUILD_DEBUGGER: "false" 
  SKIP_PATCH: "false" 

  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest 
    container: ubuntu:focal 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🐍 Install Python 2
        run: |
          sudo apt-get update || apt-get update
          sudo apt-get install -y python2 || apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python || ln -sf /usr/bin/python2 /usr/bin/python

      # 💥 终极连招 A：顺应官方文档，接通 Manual Hook
      - name: 🔌 推上官方原生 Manual Hook 电闸
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo " 正在写入 defconfig 配置..."
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_MANUAL_SU=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo " 🎯 电闸已接通，准备官方无文件原生注入！"

      # 💥 终极连招 B：基于 AST 抽象语法树的智能代码解析与注入 (剔除弃用钩子)
      - name: 🪛 实施真正的 AST 级智能注入手术
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          cat << 'EOF' > patch_ksu.py
          import os

          def add_includes(file_path, ext_code):
              if not os.path.exists(file_path): return
              with open(file_path, "r") as f: data = f.read()
              if "KSU_INC_" in data: return
              lines = data.split('\n')
              last_inc = 0
              for i, l in enumerate(lines):
                  if l.startswith("#include"): last_inc = i
              lines.insert(last_inc + 1, "/* KSU_INC_ */\n" + ext_code)
              with open(file_path, "w") as f: f.write('\n'.join(lines))

          def patch_func(file_path, func_name, hook_code):
              if not os.path.exists(file_path): return
              with open(file_path, "r") as f: lines = f.readlines()
              
              marker = f"/* KSU_HOOK_{func_name} */"
              if marker in "".join(lines): return
              
              in_func = False
              braces = 0
              injected = False
              for i, line in enumerate(lines):
                  if line.startswith(func_name) or (f" {func_name}(" in line and not line.endswith(";\n")):
                      in_func = True
                      
                  if in_func:
                      braces += line.count("{")
                      braces -= line.count("}")
                      
                      stripped = line.strip()
                      types = ("int ", "char ", "struct ", "void ", "bool ", "unsigned ", "const ", "ssize_t ", "long ", "loff_t ", "size_t ", "pid_t ", "uid_t ", "mode_t ", "umode_t ")
                      is_decl = stripped.startswith(types)
                      
                      if braces >= 1 and stripped and not is_decl and stripped != "{":
                          if braces == 1:
                              lines.insert(i, f"{marker}\n{hook_code}\n")
                              injected = True
                              break
                              
                      if braces == 0 and in_func and "}" in line:
                          break
                          
              if injected:
                  with open(file_path, "w") as f: f.writelines(lines)
                  print(f"✅ 成功注入 -> {func_name} 函数 @ {file_path}")
              else:
                  print(f"❌ 注入失败或已存在 -> {func_name} @ {file_path}")

          # ================== 开始全自动智能注入 ==================

          # 1. exec.c (Root 授权核心，已完美链接)
          add_includes("fs/exec.c", "#if defined(CONFIG_KSU)\nextern bool ksu_execveat_hook __read_mostly;\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\nextern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif")
          patch_func("fs/exec.c", "do_execveat_common", "#if defined(CONFIG_KSU)\n\t{\n\t\tint ksu_fd = fd;\n\t\tint ksu_flags = flags;\n\t\tvoid *ksu_argv = (void *)&argv;\n\t\tvoid *ksu_envp = (void *)&envp;\n\t\tif (unlikely(ksu_execveat_hook))\n\t\t\tksu_handle_execveat(&ksu_fd, &filename, ksu_argv, ksu_envp, &ksu_flags);\n\t\telse\n\t\t\tksu_handle_execveat_sucompat(&ksu_fd, &filename, ksu_argv, ksu_envp, &ksu_flags);\n\t\tfd = ksu_fd;\n\t\tflags = ksu_flags;\n\t}\n#endif")

          # 2. open.c (防检测隐藏，已完美链接)
          add_includes("fs/open.c", "#if defined(CONFIG_KSU)\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif")
          patch_func("fs/open.c", "do_faccessat", "#if defined(CONFIG_KSU)\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif")

          # 3. read_write.c (⚠️ 此钩子在无 SuSFS 的 SukiSU 中已被弃用，安全移除！)
          # 已物理拔除此处的注入代码

          # 4. stat.c (防检测隐藏，已完美链接)
          add_includes("fs/stat.c", "#if defined(CONFIG_KSU)\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif")
          patch_func("fs/stat.c", "vfs_fstatat", "#if defined(CONFIG_KSU)\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif")

          # 5. input.c (按键安全模式，已完美链接)
          add_includes("drivers/input/input.c", "#if defined(CONFIG_KSU)\nextern bool ksu_input_hook __read_mostly;\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif")
          patch_func("drivers/input/input.c", "input_handle_event", "#if defined(CONFIG_KSU)\n\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n#endif")
          EOF
          
          python3 patch_ksu.py
          echo " 🎯 AST 级智能手术完成！弃用钩子已被精准拔除！"

      # 💥 终极连招 C：防止 OOM 内存爆炸
      - name: 💊 Disable LTO to prevent OOM
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo " 正在切断 LTO 优化的电源..."
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "# CONFIG_LTO is not set" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "# CONFIG_LTO_CLANG is not set" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo " LTO 优化已彻底关闭！"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
