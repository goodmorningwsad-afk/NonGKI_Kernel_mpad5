name: Build Xiaomi Pad 5 (nabu) (DerpFest A15)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "Xiaomi Pad 5"
  DEVICE_CODENAME : "nabu"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/goodmorningwsad-afk/kernel_xiaomi_nabu-ki"
  KERNEL_BRANCH : "derp15.1"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi/nabu_inflated_defconfig" 
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  # 基石既然改好了，这里放心地交给系统自动获取！
  KERNELSU_AUTO_GET : "true" 
  KERNELSU_AUTO_FORK : "sukisu" 

  SUSFS_ENABLE : false 
  SUSFS_UPDATE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : "false"
  NEED_SAFE_DTBO : "false"

  ROM_TEXT : "rom_android"

  # Other env
  PYTHON_VERSION: "3" 

  PACK_METHOD: "Anykernel3" 

  # 必须是 shell，这样它才会下载守护进程！
  KERNELSU_METHOD: "shell" 

  PATCHES_SOURCE: "author/source" 
  PATCHES_BRANCH: "branch" 

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: "" 

  REKERNEL_ENABLE: "false" 

  # 挂钩方式： tracepoint
  HOOK_METHOD: "tracepoint" 
  HOOK_OLDER: "false" 

  KERNEL_PATCH: "false" 

  KPM_ENABLE: false 
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" 

  BASEBAND_GUARD_ENABLE: "false" 
  BASEBAND_GUARD_BOOT: "false" 

  HIDE_STUFF: "false" 

  GENERATE_DTB: "false" 
  GENERATE_CHIP: "qcom" 

  BUILD_DEBUGGER: "false" 
  SKIP_PATCH: "false" 

  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest 
    container: ubuntu:focal 
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🐍 Install Python 2
        run: |
          sudo apt-get update || apt-get update
          sudo apt-get install -y python2 || apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python || ln -sf /usr/bin/python2 /usr/bin/python

      #  接通 Manual Hook，无视路径全图锁定修复版本号！
      - name: 🔌 推上官方原生 Manual Hook 电闸并修复版本号
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo " 正在写入 defconfig 配置..."
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_MANUAL_SU=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          
          #  全图追踪：不管 SukiSU 被放在哪个文件夹，直接搜索 Kbuild 和 Makefile
          # 把那句坑人的动态计算直接替换成死数字 40496！
          find . -type f \( -name "Kbuild" -o -name "Makefile" \) -exec sed -i 's/-DKSU_VERSION=$(KSU_VERSION)/-DKSU_VERSION=40496/g' {} +
          
          echo " 🎯 版本号 0 的 Bug 已被全图锁定并彻底抹杀，当前版本 40496！"

      # 💥免疫宏定义的正则级精准 
      - name: 🪛 实施正则级精准上下文
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          cat << 'EOF' > patch_ksu.py
          import os, re

          def apply_patch(file_path, header_search, header_code, logic_search, logic_code):
              if not os.path.exists(file_path):
                  return
              with open(file_path, "r") as f:
                  data = f.read()

              if "KSU_HOOK_APPLIED" in data:
                  print(f" 已注入过: {file_path}")
                  return

              # 注入头文件外部声明
              data = re.sub(header_search, r'\1\n/* KSU_HOOK_APPLIED */\n' + header_code, data, count=1)
              # 注入核心逻辑代码 (依靠严格的上下文指纹匹配)
              new_data = re.sub(logic_search, r'\1' + logic_code + r'\n\t\2', data, count=1)
              
              if new_data != data:
                  with open(file_path, "w") as f:
                      f.write(new_data)
                  print(f" 成功物理注入: {file_path}")
              else:
                  print(f" 找不到注入点(指纹不匹配): {file_path}")

          # 1. exec.c (Root 授权核心)
          apply_patch("fs/exec.c", 
              r'(#include <linux/binfmts\.h>)',
              "#if defined(CONFIG_KSU)\nextern bool ksu_execveat_hook __read_mostly;\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\nextern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n",
              r'(struct files_struct \*displaced;\s+int retval;\s+)(if \(IS_ERR\(filename\)\))',
              "#if defined(CONFIG_KSU)\n\t{\n\t\tint ksu_fd = fd;\n\t\tint ksu_flags = flags;\n\t\tvoid *ksu_argv = (void *)&argv;\n\t\tvoid *ksu_envp = (void *)&envp;\n\t\tif (unlikely(ksu_execveat_hook))\n\t\t\tksu_handle_execveat(&ksu_fd, &filename, ksu_argv, ksu_envp, &ksu_flags);\n\t\telse\n\t\t\tksu_handle_execveat_sucompat(&ksu_fd, &filename, ksu_argv, ksu_envp, &ksu_flags);\n\t\tfd = ksu_fd;\n\t\tflags = ksu_flags;\n\t}\n#endif\n")

          # 2. open.c (防检测隐藏核心)
          apply_patch("fs/open.c",
              r'(#include "internal\.h")',
              "#if defined(CONFIG_KSU)\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n",
              r'(unsigned int lookup_flags = LOOKUP_FOLLOW;\s+)(if \(mode & ~S_IRWXO\))',
              "#if defined(CONFIG_KSU)\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n")

          # 3. stat.c (真相大白：基于 vfs_statx 的完美指纹)
          apply_patch("fs/stat.c",
              r'(#include <linux/syscalls\.h>)',
              "#if defined(CONFIG_KSU)\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\n",
              r'(unsigned int lookup_flags = LOOKUP_FOLLOW \| LOOKUP_AUTOMOUNT;\s+)(if \(\(flags & ~\()',
              "#if defined(CONFIG_KSU)\n\tksu_handle_stat(&dfd, &filename, &flags);\n#endif\n")

          # 4. input.c (按键防救砖安全模式)
          apply_patch("drivers/input/input.c",
              r'(MODULE_AUTHOR\("Vojtech Pavlik <vojtech@suse\.cz>"\);)',
              "#if defined(CONFIG_KSU)\nextern bool ksu_input_hook __read_mostly;\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif\n",
              r'(int disposition = input_get_disposition\(dev, type, code, &value\);\s+)(if \(disposition != INPUT_IGNORE_EVENT && type != EV_SYN\))',
              "#if defined(CONFIG_KSU)\n\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n#endif\n")
          EOF
          
          python3 patch_ksu.py
          echo "  所有文件指纹匹配完毕！"
          
      #  防止 OOM 内存爆炸
      - name:  Disable LTO to prevent OOM
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo " 正在切断 LTO 优化的电源..."
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "# CONFIG_LTO is not set" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "# CONFIG_LTO_CLANG is not set" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo " LTO 优化已彻底关闭！"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
