name: "SukiSU & SuSFS Phantom Hooks"
description: "Apply SuSFS 4.19 core patch and inject Phantom Hooks for SukiSU"

runs:
  using: "composite"
  steps:
    - name: 🪄 Apply SuSFS 4.19 Patch & Phantom SukiSU Hooks
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/device_kernel
        
        # 💥 清理防重复锁，确保强制执行
        rm -f .phantom_hooks_applied
        
        echo "==== 0. 唤醒 SuSFS 与文件系统大动脉开关 ===="
        DEFCONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
        
        sed -i 's/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/g' "$DEFCONFIG_FILE"
        
        echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$DEFCONFIG_FILE"
        
        echo "CONFIG_BLK_DEV_LOOP=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_SQUASHFS=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_SQUASHFS_FILE_DIRECT=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_SQUASHFS_DECOMP_MULTI_PERCPU=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_SQUASHFS_XATTR=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_SQUASHFS_LZ4=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_SQUASHFS_LZO=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_SQUASHFS_XZ=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_EROFS_FS=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_EROFS_FS_ZIP=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_EROFS_FS_ZIP_LZ4=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_LZ4_DECOMPRESS=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_TMPFS=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG_FILE"
        
        grep -q "erofs" fs/Kconfig || sed -i '/source "fs\/ext4\/Kconfig"/a source "fs/erofs/Kconfig"' fs/Kconfig
        grep -q "erofs" fs/Makefile || echo 'obj-$(CONFIG_EROFS_FS) += erofs/' >> fs/Makefile

        echo "==== 1. 物理缝合 SuSFS 3000行隐身大动脉 ===="
        set +e
        PATCH_FILE=$(find /tmp $GITHUB_WORKSPACE -name "susfs_patch_to_4.19.patch" 2>/dev/null | head -n 1)
        set -e
        
        if [ -z "$PATCH_FILE" ]; then
            echo "❌ 致命错误：找不到 susfs_patch_to_4.19.patch！"
            exit 1 
        else
            if grep -q "susfs.o" fs/Makefile 2>/dev/null; then
                echo "⏭️ 检测到 fs/Makefile 已包含 susfs.o，跳过 patch 阶段！"
            else
                patch -p1 -N -f < "$PATCH_FILE" || echo "⚠️ 补丁产生 .rej 拒绝文件，保留全尸继续！"
            fi
        fi

        sed -i 's/obj-$(CONFIG_KSU_SUSFS) += susfs.o/obj-y += susfs.o/g' fs/Makefile
        grep -q "obj-y += susfs.o" fs/Makefile || echo 'obj-y += susfs.o' >> fs/Makefile
        grep -q "DCONFIG_KSU_SUSFS" fs/Makefile || {
            echo 'ccflags-y += -DCONFIG_KSU_SUSFS=1 -DCONFIG_KSU_SUSFS_SUS_PATH=1 -DCONFIG_KSU_SUSFS_SUS_MOUNT=1 -DCONFIG_KSU_SUSFS_SUS_KSTAT=1' >> fs/Makefile
        }
        
        if [ -f "fs/susfs.c" ]; then
            grep -q "EXPORT_SYMBOL(susfs_extra_works);" fs/susfs.c || {
                echo "#include <linux/export.h>" >> fs/susfs.c
                echo "EXPORT_SYMBOL(susfs_extra_works);" >> fs/susfs.c
            }
        fi

        echo "==== [兼容修复] 清除 SukiSU 源码中重复的辅助函数 ===="
        KSU_DIR=$(find $GITHUB_WORKSPACE -type d \( -name "KernelSU" -o -name "kernelsu" -o -name "SukiSU" \) -not -path "*/out/*" -not -path "*/.git/*" | head -n 1)
        if [ -n "$KSU_DIR" ]; then
            ADB_ROOT=$(find "$KSU_DIR" -type f -name "adb_root.c" | head -n 1)
            if [ -n "$ADB_ROOT" ]; then
                sed -i 's/static inline bool susfs_starts_with/\/\/ static inline bool susfs_starts_with/g' "$ADB_ROOT"
                sed -i 's/static inline bool susfs_ends_with/\/\/ static inline bool susfs_ends_with/g' "$ADB_ROOT"
            fi
        fi

        echo "==== 2. 载入极客法医级 Bash 缝合函数 ===="
        patch_file() {
            local file="$1"
            local search_str="$2"
            local offset="$3"
            local insert_code="$4"
            local identifier="$5"
            
            if grep -q "$identifier" "$file"; then return 0; fi
            if ! grep -Fq "$search_str" "$file"; then exit 1; fi
            awk -v search="$search_str" -v offset="$offset" -v code="$insert_code" '
            index($0, search) && !done {
                if (offset == 0) { print code; print; }
                else { print; count = offset; while(count > 0 && getline > 0) { print; count--; } print code; }
                done = 1; next
            } { print }' "$file" > tmp_file && mv tmp_file "$file"
        }

        echo "==== [手工缝合] 修复 LineageOS 专属的 .rej 冲突 ===="
        
        # 补上缺失的头文件
        grep -q "linux/susfs_def.h" fs/open.c || sed -i '1i #include <linux/susfs_def.h>' fs/open.c

        # 逐字还原你之前确认过的头文件防线！
        TASK_MMU_HOOK="
        /* FIX_TASK_MMU_REJ */
        #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP)
        #include <linux/susfs_def.h>
        #endif"
        patch_file "fs/proc/task_mmu.c" "#include <asm/elf.h>" 0 "$TASK_MMU_HOOK" "FIX_TASK_MMU_REJ"

        MOUNT_H_HOOK="
        /* FIX_MOUNT_H_REJ */
        #ifdef CONFIG_KSU_SUSFS
            u64 susfs_mnt_id_backup;
        #endif"
        patch_file "include/linux/mount.h" "void *data;" 0 "$MOUNT_H_HOOK" "FIX_MOUNT_H_REJ"

        PROC_NS_HOOK="
        /* FIX_PROC_NS_REJ */
        #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
        #include <linux/susfs_def.h>
        extern bool susfs_hide_sus_mnts_for_non_su_procs;
        extern bool susfs_is_current_ksu_domain(void);
        #endif"
        patch_file "fs/proc_namespace.c" "#include \"internal.h\"" 0 "$PROC_NS_HOOK" "FIX_PROC_NS_REJ"

        STAT_TOP_HOOK="
        /* FIX_STAT_REJ */
        #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
        #include <linux/susfs_def.h>
        extern void susfs_sus_ino_for_generic_fillattr(unsigned long ino, struct kstat *stat);
        #endif"
        patch_file "fs/stat.c" "#include <linux/compat.h>" 0 "$STAT_TOP_HOOK" "FIX_STAT_REJ"

        if ! grep -q "susfs_get_non_sus_mnt_id_from_mnt" fs/namespace.c; then
            cat << 'EOF' >> fs/namespace.c

        #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
        int susfs_get_non_sus_mnt_id_from_mnt(struct mount *orig_mnt) {
            struct mount *mnt = orig_mnt;
            int mnt_id;
            lock_mount_hash();
            for (; mnt && mnt->mnt_parent && mnt != mnt->mnt_parent && mnt->mnt_id >= DEFAULT_KSU_MNT_ID; mnt = mnt->mnt_parent) { }
            mnt_id = mnt->mnt_id;
            unlock_mount_hash();
            return mnt_id;
        }

        struct vfsmount *susfs_get_non_sus_vfsmnt_from_vfsmnt(struct vfsmount *vfsmnt) {
            struct mount *mnt = real_mount(vfsmnt);
            lock_mount_hash();
            for (; mnt && mnt->mnt_parent && mnt != mnt->mnt_parent && mnt->mnt_id >= DEFAULT_KSU_MNT_ID; mnt = mnt->mnt_parent) { }
            mntget(&mnt->mnt);
            if (!mnt->mnt.mnt_root || IS_ERR(mnt->mnt.mnt_root)) {
                mntput(&mnt->mnt);
                unlock_mount_hash();
                return vfsmnt;
            }
            dget(mnt->mnt.mnt_root);
            unlock_mount_hash();
            return &mnt->mnt;
        }
        #endif
        EOF
        fi

        echo "==== [回归原生纯净打孔] 恢复那消失的 100 行 KSU 拦截器 ===="
        
        grep -q "<linux/jump_label.h>" drivers/input/input.c || sed -i '1i #include <linux/jump_label.h>' drivers/input/input.c || true
        grep -q "<linux/jump_label.h>" fs/read_write.c || sed -i '1i #include <linux/jump_label.h>' fs/read_write.c || true
        
        grep -q "ksu_input_hook_key_false" drivers/input/input.c || {
            echo "DEFINE_STATIC_KEY_FALSE(ksu_input_hook_key_false);" >> drivers/input/input.c
            echo "EXPORT_SYMBOL(ksu_input_hook_key_false);" >> drivers/input/input.c
        }
        grep -q "ksu_init_rc_hook_key_false" fs/read_write.c || {
            echo "DEFINE_STATIC_KEY_FALSE(ksu_init_rc_hook_key_false);" >> fs/read_write.c
            echo "EXPORT_SYMBOL(ksu_init_rc_hook_key_false);" >> fs/read_write.c
        }
        grep -q "ksu_vfs_read_hook_defined" fs/read_write.c || {
            echo "/* ksu_vfs_read_hook_defined */" >> fs/read_write.c
            echo "bool ksu_vfs_read_hook __read_mostly = true;" >> fs/read_write.c
            echo "EXPORT_SYMBOL(ksu_vfs_read_hook);" >> fs/read_write.c
        }
        grep -q "ksu_execveat_hook_defined" fs/exec.c || {
            echo "/* ksu_execveat_hook_defined */" >> fs/exec.c
            echo "bool ksu_execveat_hook __read_mostly = true;" >> fs/exec.c
            echo "EXPORT_SYMBOL(ksu_execveat_hook);" >> fs/exec.c
        }
        grep -q "ksu_handle_devpts" fs/devpts/inode.c || {
            echo "void __attribute__((weak)) ksu_handle_devpts(struct inode* inode) {}" >> fs/devpts/inode.c
            echo "EXPORT_SYMBOL(ksu_handle_devpts);" >> fs/devpts/inode.c
        }

        EXEC_HOOK="
        #ifdef CONFIG_KSU
        {
            extern bool ksu_execveat_hook __read_mostly;
            extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
            extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
            if (unlikely(ksu_execveat_hook))
                ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
            else
                ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
        }
        #endif"
        patch_file "fs/exec.c" "return __do_execve_file(fd, filename, argv, envp, flags, NULL);" 0 "$EXEC_HOOK" "ksu_execveat_hook"
        
        OPEN_HOOK="
        #ifdef CONFIG_KSU
        {
            extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
            ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
        }
        #endif"
        patch_file "fs/open.c" "if (mode & ~S_IRWXO)" 0 "$OPEN_HOOK" "ksu_handle_faccessat"

        STAT_HOOK="
        #ifdef CONFIG_KSU
        {
            extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
            ksu_handle_stat(&dfd, &filename, &flags);
        }
        #endif"
        patch_file "fs/stat.c" "if ((flags & ~(AT_SYMLINK_NOFOLLOW" 0 "$STAT_HOOK" "ksu_handle_stat"

        DEVPTS_HOOK="
        #ifdef CONFIG_KSU
        {
            extern void ksu_handle_devpts(struct inode*);
            ksu_handle_devpts(dentry->d_inode);
        }
        #endif"
        patch_file "fs/devpts/inode.c" "if (dentry->d_sb->s_magic != DEVPTS_SUPER_MAGIC)" 0 "$DEVPTS_HOOK" "ksu_handle_devpts"

        INPUT_HOOK="
        #ifdef CONFIG_KSU
        {
            extern struct static_key_false ksu_input_hook_key_false;
            extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
            if (static_branch_unlikely(&ksu_input_hook_key_false))
                ksu_handle_input_handle_event(&type, &code, &value);
        }
        #endif"
        patch_file "drivers/input/input.c" "if (disposition != INPUT_IGNORE_EVENT && type != EV_SYN)" 0 "$INPUT_HOOK" "ksu_handle_input_handle_event"

        VFS_READ_HOOK="
        #ifdef CONFIG_KSU
        {
            extern bool ksu_vfs_read_hook __read_mostly;
            extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos_ptr);
            if (unlikely(ksu_vfs_read_hook))
                ksu_handle_vfs_read(&file, &buf, &count, &pos);
        }
        #endif"
        patch_file "fs/read_write.c" "if (!(file->f_mode & FMODE_READ))" 0 "$VFS_READ_HOOK" "ksu_vfs_read_hook"

        READ_HOOK="
        #ifdef CONFIG_KSU
        {
            extern struct static_key_false ksu_init_rc_hook_key_false;
            extern void ksu_handle_sys_read(unsigned int fd);
            if (static_branch_unlikely(&ksu_init_rc_hook_key_false))
                ksu_handle_sys_read(fd);
        }
        #endif"
        patch_file "fs/read_write.c" "if (f.file) {" 0 "$READ_HOOK" "ksu_handle_sys_read"

        if ! grep -q "path_umount" fs/namespace.c; then
            cat << 'EOF' >> fs/namespace.c

        static int can_umount(const struct path *path, int flags)
        {
            struct mount *mnt = real_mount(path->mnt);
            if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
                return -EINVAL;
            if (!may_mount())
                return -EPERM;
            if (path->dentry != path->mnt->mnt_root)
                return -EINVAL;
            if (!check_mnt(mnt))
                return -EINVAL;
            if (mnt->mnt.mnt_flags & MNT_LOCKED) /* Check optimistically */
                return -EINVAL;
            if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
                return -EPERM;
            return 0;
        }

        int path_umount(struct path *path, int flags)
        {
            struct mount *mnt = real_mount(path->mnt);
            int ret;
            ret = can_umount(path, flags);
            if (!ret)
                ret = do_umount(mnt, flags);
            dput(path->dentry);
            mntput_no_expire(mnt);
            return ret;
        }
        EOF
        fi

        HOOKS_PATCH_1="
        #ifdef CONFIG_KSU
        /* KSU_SELINUX_BYPASS_UNIVERSAL_1 */
        {
            static u32 ksu_sid;
            if(!ksu_sid){
                security_secctx_to_secid(\"u:r:su:s0\", strlen(\"u:r:su:s0\"), &ksu_sid);
            }
            if(new_tsec->sid == ksu_sid){
                return 0;
            }
        }
        #endif"
        patch_file "security/selinux/hooks.c" "if (!nnp && !nosuid)" 0 "$HOOKS_PATCH_1" "KSU_SELINUX_BYPASS_UNIVERSAL_1"
        
        HOOKS_PATCH_2="
        #ifdef CONFIG_KSU
        /* KSU_SELINUX_BYPASS_UNIVERSAL_2 */
        {
            static u32 ksu_sid;
            if(!ksu_sid){
                security_secctx_to_secid(\"u:r:su:s0\", strlen(\"u:r:su:s0\"), &ksu_sid);
            }
            if(new_tsec->sid == ksu_sid){
                return 0;
            }
        }
        #endif"
        patch_file "security/selinux/hooks.c" "return 0; /* No change in credentials */" 1 "$HOOKS_PATCH_2" "KSU_SELINUX_BYPASS_UNIVERSAL_2"
        
        HOOKS_PATCH_3="
        #ifdef CONFIG_KSU
        {
            extern bool is_ksu_transition(const void *old_tsec, const void *new_tsec);
            if (is_ksu_transition(current_security(), bprm->cred->security))
                return 0;
        }
        #endif"
        patch_file "security/selinux/hooks.c" "new_tsec = bprm->cred->security;" 0 "$HOOKS_PATCH_3" "is_ksu_transition"

        SYS_HOOK="
        #ifdef CONFIG_KSU
        {
            extern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);
            ksu_handle_setresuid(ruid, euid, suid);
        }
        #endif"
        patch_file "kernel/sys.c" "ksuid = make_kuid(ns, suid);" 1 "$SYS_HOOK" "ksu_handle_setresuid"

        REBOOT_HOOK="
        #ifdef CONFIG_KSU
        {
            extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
            if (ksu_handle_sys_reboot(magic1, magic2, cmd, &arg) == 0)
                return 0;
        }
        #endif"
        patch_file "kernel/reboot.c" "if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))" 0 "$REBOOT_HOOK" "ksu_handle_sys_reboot"
        
        echo "==== [擦屁股行动] 修复 LineageOS 原生编译 Bug ===="
        
        CPUSET_HOOK_1="
        #ifdef CONFIG_CPUSET_ASSIST
        /* CPUSET_ASSIST_FIX_START */"
        patch_file "kernel/cgroup/cpuset.c" "static ssize_t cpuset_write_resmask_assist(struct kernfs_open_file *of," 0 "$CPUSET_HOOK_1" "CPUSET_ASSIST_FIX_START"
        
        CPUSET_HOOK_2="
        /* CPUSET_ASSIST_FIX_END */
        #endif"
        patch_file "kernel/cgroup/cpuset.c" "static ssize_t cpuset_write_resmask_wrapper(struct kernfs_open_file *of," 0 "$CPUSET_HOOK_2" "CPUSET_ASSIST_FIX_END"
        
        INSN_HOOK="
        /* MODULE_PLTS_INSN_FIX */
        #include <asm/insn.h>"
        patch_file "arch/arm64/kernel/module-plts.c" "#include <linux/sort.h>" 0 "$INSN_HOOK" "MODULE_PLTS_INSN_FIX"
        
        TUNE_HOOK="
        /* STUNE_ASSIST_WRAPPER_FIX */
        #ifndef CONFIG_STUNE_ASSIST
        #define sched_boost_override_write_wrapper sched_boost_override_write
        #define sched_colocate_write_wrapper sched_colocate_write
        #define boost_write_wrapper boost_write
        #define prefer_idle_write_wrapper prefer_idle_write
        #endif"
        patch_file "kernel/sched/tune.c" "static struct cftype files[] = {" 0 "$TUNE_HOOK" "STUNE_ASSIST_WRAPPER_FIX"
        sed -i 's/-dirty//g' scripts/setlocalversion
        
        echo "🩹 正在缝合 drivers/mmc/core/core.c ..."
        MMC_BKOPS_HOOK="
        /* MMC_BKOPS_FIX */
        #ifndef mmc_card_doing_bkops
        #define mmc_card_doing_bkops(c) (0)
        #endif"
        patch_file "drivers/mmc/core/core.c" "static bool mmc_is_valid_state_for_clk_scaling(struct mmc_host *host)" 0 "$MMC_BKOPS_HOOK" "MMC_BKOPS_FIX"
        
        echo "🩹 正在缝合 kernel/cpu.c ..."
        sed -i 's/#if CONFIG_LITTLE_CPU_MASK/#if 0/g' kernel/cpu.c 
        sed -i 's/#if CONFIG_BIG_CPU_MASK/#if 0/g' kernel/cpu.c 
        sed -i 's/#if CONFIG_PRIME_CPU_MASK/#if 0/g' kernel/cpu.c 
        
        echo "🩹 正在缝合 lib/lz4/lz4_decompress.c ..."
        sed -i 's/EXPORT_SYMBOL(LZ4_decompress_safe_partial);/\/\/ EXPORT_SYMBOL(LZ4_decompress_safe_partial);/g' lib/lz4/lz4_decompress.c
        sed -i 's/EXPORT_SYMBOL(LZ4_setStreamDecode);/\/\/ EXPORT_SYMBOL(LZ4_setStreamDecode);/g' lib/lz4/lz4_decompress.c
        sed -i 's/EXPORT_SYMBOL(LZ4_decompress_safe_continue);/\/\/ EXPORT_SYMBOL(LZ4_decompress_safe_continue);/g' lib/lz4/lz4_decompress.c
        sed -i 's/EXPORT_SYMBOL(LZ4_decompress_fast_continue);/\/\/ EXPORT_SYMBOL(LZ4_decompress_fast_continue);/g' lib/lz4/lz4_decompress.c
        sed -i 's/EXPORT_SYMBOL(LZ4_decompress_safe_usingDict);/\/\/ EXPORT_SYMBOL(LZ4_decompress_safe_usingDict);/g' lib/lz4/lz4_decompress.c
        sed -i 's/EXPORT_SYMBOL(LZ4_decompress_fast_usingDict);/\/\/ EXPORT_SYMBOL(LZ4_decompress_fast_usingDict);/g' lib/lz4/lz4_decompress.c

        echo "🩹 正在缝合 net/ipv6/tcp_ipv6.c 和 net/ipv4/tcp_ipv4.c ..."
        perl -0777 -pi -e 's/#ifndef CONFIG_MPTCP\nstatic\n#endif\nconst struct tcp_request_sock_ops/const struct tcp_request_sock_ops/g' net/ipv4/tcp_ipv4.c
        perl -0777 -pi -e 's/#ifndef CONFIG_MPTCP\nstatic\n#endif\nconst struct tcp_request_sock_ops/const struct tcp_request_sock_ops/g' net/ipv6/tcp_ipv6.c

        echo "🩹 正在缝合 lib/zstd/common/bitstream.h ..."
        sed -i 's|ZSTD_FALLTHROUGH;|/* fallthrough */|g' lib/zstd/common/bitstream.h
        
        echo "🩹 正在全盘缝合 lib/zstd/ 目录下的 ZSTD_FALLTHROUGH ..."
        find lib/zstd -type f -exec sed -i 's|ZSTD_FALLTHROUGH;|/* fallthrough */|g' {} +
        
        echo "🩹 正在为 vmlinux 大一统注入最后的物理替身..."
        echo "bool is_ksu_transition(const void *old_tsec, const void *new_tsec) { return false; }" >> security/selinux/hooks.c
        echo "void sdhci_set_uhs_signaling(struct sdhci_host *host, unsigned timing) {}" >> drivers/mmc/host/sdhci-pltfm.c
        
        echo "🩹 正在为 MODPOST 注入 ion_alloc_dmabuf 弱引用替身..."
        cat << 'EOF' >> mm/madvise.c

        #include <linux/export.h>
        void * __attribute__((weak)) ion_alloc_dmabuf(size_t len, unsigned int heap_id_mask, unsigned int flags) { return (void *)0; }
        EXPORT_SYMBOL(ion_alloc_dmabuf);
        EOF
        
        sed -i 's/-dirty//g' scripts/setlocalversion
        
        touch .phantom_hooks_applied
        echo "✅ 修复所有链接符号，全境畅通，起飞！"
