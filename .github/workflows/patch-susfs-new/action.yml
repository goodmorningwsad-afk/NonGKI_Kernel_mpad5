name: "SukiSU & SuSFS Phantom Hooks"
description: "Apply SuSFS 4.19 core patch and inject Phantom Hooks for SukiSU"

runs:
  using: "composite"
  steps:
    - name: 🪄 Apply SuSFS 4.19 Patch & Phantom SukiSU Hooks
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/device_kernel
        
        if [ -f ".phantom_hooks_applied" ]; then
            echo "⏭️ 幻影打孔已运行过，跳过！"
            exit 0
        fi
        
        echo "==== 0. 开启 SuSFS 大动脉开关 ===="
        DEFCONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
        echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_TMPFS=y" >> "$DEFCONFIG_FILE"

        echo "==== 1. 应用 SuSFS 核心补丁 ===="
        PATCH_FILE=$(find /tmp $GITHUB_WORKSPACE -name "susfs_patch_to_4.19.patch" | head -n 1)
        if [ -n "$PATCH_FILE" ]; then
            patch -p1 -N -f < "$PATCH_FILE" || echo "⚠️ 补丁产生冲突，保留继续。"
        fi

        echo "==== 2. 载入极客缝合函数 ===="
        patch_file() {
            local file="$1"
            local search="$2"
            local offset="$3"
            local code="$4"
            local id="$5"
            if grep -q "$id" "$file"; then return 0; fi
            awk -v search="$search" -v offset="$offset" -v code="$code" '
            index($0, search) && !done {
                if (offset == 0) { print code; print; }
                else { print; c = offset; while(c > 0 && getline > 0) { print; c--; } print code; }
                done = 1; next
            } { print }' "$file" > tmp && mv tmp "$file"
        }

        echo "==== 3. [原生底盘打孔] 补齐致命的 vfs_read 劫持 ===="
        VFS_READ_HOOK="
        #ifdef CONFIG_KSU
        {
            extern bool ksu_vfs_read_hook __read_mostly;
            extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos_ptr);
            if (unlikely(ksu_vfs_read_hook))
                ksu_handle_vfs_read(&file, &buf, &count, &pos);
        }
        #endif"
        patch_file "fs/read_write.c" "if (!(file->f_mode & FMODE_READ))" 0 "$VFS_READ_HOOK" "ksu_vfs_read_hook"

        echo "==== 4. [其他核心打孔] 确保 Root 与状态欺骗存活 ===="
        EXEC_HOOK="#ifdef CONFIG_KSU\n{ extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags); ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags); }\n#endif"
        patch_file "fs/exec.c" "return __do_execve_file(fd, filename, argv, envp, flags, NULL);" 0 "$EXEC_HOOK" "ksu_execveat_hook"

        OPEN_HOOK="#ifdef CONFIG_KSU\n{ extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags); ksu_handle_faccessat(&dfd, &filename, &mode, NULL); }\n#endif"
        patch_file "fs/open.c" "if (mode & ~S_IRWXO)" 0 "$OPEN_HOOK" "ksu_handle_faccessat"

        STAT_HOOK="#ifdef CONFIG_KSU\n{ extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags); ksu_handle_stat(&dfd, &filename, &flags); }\n#endif"
        patch_file "fs/stat.c" "if ((flags & ~(AT_SYMLINK_NOFOLLOW" 0 "$STAT_HOOK" "ksu_handle_stat"

        touch .phantom_hooks_applied
        echo "✅ 打孔完成，起飞！"
