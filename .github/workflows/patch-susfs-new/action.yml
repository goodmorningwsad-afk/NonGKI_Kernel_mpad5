name: "SukiSU & SuSFS Phantom Hooks"
description: "Apply SuSFS 4.14 core patch and inject Phantom Hooks for SukiSU"

runs:
  using: "composite"
  steps:
    - name: 🪄 Apply SuSFS 4.14 Patch & Phantom SukiSU Hooks
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/device_kernel

        echo "==== 0. 唤醒 SuSFS 内核编译大动脉开关 ===="
        DEFCONFIG_FILE="arch/arm64/configs/vendor/xiaomi/nabu_inflated_defconfig"
        
        # 🚨 强行把 SuSFS 的所有满级隐身模块注入到编译配置清单中！
        cat << 'EOF' >> "$DEFCONFIG_FILE"
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        EOF
        echo "✅ SuSFS 物理开关全数合闸！"
        
        echo "==== 1. 物理缝合 SuSFS 3000行隐身大动脉 ===="
        # 🚨 直接去 build-ready 下载的老巢 /tmp 临时目录里拿图纸！
        PATCH_FILE=$(find /tmp $GITHUB_WORKSPACE -name "susfs_patch_to_4.14.patch" 2>/dev/null | head -n 1)
        
        if [ -z "$PATCH_FILE" ]; then
            echo "❌ 致命错误：在 /tmp 和整个仓库里都没找到 susfs_patch_to_4.14.patch！"
            exit 1
        fi
        
        echo "🔍 锁定物理补丁原件: $PATCH_FILE"
        patch -p1 -f < "$PATCH_FILE" || echo "⚠️ 部分补丁存在冲突，已自动生成 .rej 文件并强制继续！"

        echo "==== 2. 载入极客法医级 Bash 缝合函数 ===="
        patch_file() {
            local file="$1"
            local search_str="$2"
            local offset="$3"
            local insert_code="$4"
            local identifier="$5"
            
            echo "🔍 正在处理: $file"
            if grep -q "$identifier" "$file"; then
                echo "⚠️ $file 已包含 $identifier，跳过。"
                return 0
            fi
            if ! grep -Fq "$search_str" "$file"; then
                echo "❌ 致命错误: 在 $file 中找不到特征字符串 '$search_str'！"
                exit 1
            fi
            awk -v search="$search_str" -v offset="$offset" -v code="$insert_code" '
            index($0, search) && !done {
                if (offset == 0) { print code; print; }
                else { print; count = offset; while(count > 0 && getline > 0) { print; count--; } print code; }
                done = 1
                next
            }
            { print }
            ' "$file" > tmp_file && mv tmp_file "$file"
            
            if grep -q "$identifier" "$file"; then
                echo "✅ 成功缝合: $file"
            else
                echo "❌ 致命错误: $file 处理完毕，但未写入 $identifier！"
                exit 1
            fi
        }
        
        echo "==== [幻影打孔区] (自动规避银行App) ===="
        
        echo "==== [幻影打孔] fs/exec.c ===="
        EXEC_HOOK="
        #ifdef CONFIG_KSU
        {
            extern bool ksu_execveat_hook __read_mostly;
            extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
            extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
        #ifdef CONFIG_KSU_SUSFS
            extern bool susfs_is_current_proc_umounted(void);
            if (!susfs_is_current_proc_umounted()) {
        #endif
                if (unlikely(ksu_execveat_hook))
                    ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
                else
                    ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
        #ifdef CONFIG_KSU_SUSFS
            }
        #endif
        }
        #endif"
        patch_file "fs/exec.c" "bprm = kzalloc(sizeof(*bprm), GFP_KERNEL);" 0 "$EXEC_HOOK" "ksu_execveat_hook"

        echo "==== [幻影打孔] fs/open.c ===="
        OPEN_HOOK="
        #ifdef CONFIG_KSU
        {
            extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
        #ifdef CONFIG_KSU_SUSFS
            extern bool susfs_is_current_proc_umounted(void);
            if (!susfs_is_current_proc_umounted()) {
        #endif
                ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
        #ifdef CONFIG_KSU_SUSFS
            }
        #endif
        }
        #endif"
        patch_file "fs/open.c" "if (mode & ~S_IRWXO)" 0 "$OPEN_HOOK" "ksu_handle_faccessat"

        echo "==== [幻影打孔] fs/stat.c ===="
        STAT_HOOK="
        #ifdef CONFIG_KSU
        {
            extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
        #ifdef CONFIG_KSU_SUSFS
            extern bool susfs_is_current_proc_umounted(void);
            if (!susfs_is_current_proc_umounted()) {
        #endif
                ksu_handle_stat(&dfd, &filename, &flags);
        #ifdef CONFIG_KSU_SUSFS
            }
        #endif
        }
        #endif"
        patch_file "fs/stat.c" "if ((flags & ~(AT_SYMLINK_NOFOLLOW" 0 "$STAT_HOOK" "ksu_handle_stat"

        echo "==== [幻影打孔] fs/devpts/inode.c ===="
        DEVPTS_HOOK="
        #ifdef CONFIG_KSU
        {
            extern void ksu_handle_devpts(struct inode*);
        #ifdef CONFIG_KSU_SUSFS
            extern bool susfs_is_current_proc_umounted(void);
            if (!susfs_is_current_proc_umounted()) {
        #endif
                ksu_handle_devpts(dentry->d_inode);
        #ifdef CONFIG_KSU_SUSFS
            }
        #endif
        }
        #endif"
        patch_file "fs/devpts/inode.c" "if (dentry->d_sb->s_magic != DEVPTS_SUPER_MAGIC)" 0 "$DEVPTS_HOOK" "ksu_handle_devpts"

        echo "==== [手工缝合] 修复唯一的 .rej 冲突 (fs/proc/cmdline.c) ===="

        CMDLINE_HOOK_1="
        #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
        extern int susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);
        #endif"
        # 挂载在函数声明之前
        patch_file "fs/proc/cmdline.c" "static int cmdline_proc_show" 0 "$CMDLINE_HOOK_1" "extern int susfs_spoof_cmdline_or_bootconfig"
        
        CMDLINE_HOOK_2="
        #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
        	if (!susfs_spoof_cmdline_or_bootconfig(m)) {
        		seq_putc(m, '\n');
        		return 0;
        	}
        #endif"
        # 挂载在 seq_printf 打印启动参数之前
        patch_file "fs/proc/cmdline.c" "seq_printf(m" 0 "$CMDLINE_HOOK_2" "susfs_spoof_cmdline_or_bootconfig(m)"

        echo "==== [原生底盘区] (系统级通信与底层救砖，保持绝对原生) ===="
        
        echo "==== 缝合 drivers/input/input.c (安全模式防砖监听) ===="
        INPUT_HOOK="
        #ifdef CONFIG_KSU
        {
            extern bool ksu_input_hook __read_mostly;
            extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
            if (unlikely(ksu_input_hook))
                ksu_handle_input_handle_event(&type, &code, &value);
        }
        #endif"
        patch_file "drivers/input/input.c" "if (disposition != INPUT_IGNORE_EVENT && type != EV_SYN)" 0 "$INPUT_HOOK" "ksu_handle_input_handle_event"

        echo "==== 正在复活 path_umount 模块神技 ===="
        if ! grep -q "path_umount" fs/namespace.c; then
            cat << 'EOF' >> fs/namespace.c

        static int can_umount(const struct path *path, int flags)
        {
            struct mount *mnt = real_mount(path->mnt);
            if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
                return -EINVAL;
            if (!may_mount())
                return -EPERM;
            if (path->dentry != path->mnt->mnt_root)
                return -EINVAL;
            if (!check_mnt(mnt))
                return -EINVAL;
            if (mnt->mnt.mnt_flags & MNT_LOCKED) /* Check optimistically */
                return -EINVAL;
            if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
                return -EPERM;
            return 0;
        }

        int path_umount(struct path *path, int flags)
        {
            struct mount *mnt = real_mount(path->mnt);
            int ret;
            ret = can_umount(path, flags);
            if (!ret)
                ret = do_umount(mnt, flags);
            dput(path->dentry);
            mntput_no_expire(mnt);
            return ret;
        }
        EOF
            echo "✅ fs/namespace.c (path_umount) 追加完成！"
        else
            echo "⚠️ fs/namespace.c 已存在 path_umount，跳过。"
        fi

        echo "==== 缝合 security/selinux/hooks.c (终极双重免死金牌) ===="
        HOOKS_PATCH_1="
        #ifdef CONFIG_KSU
        /* KSU_SELINUX_BYPASS_UNIVERSAL_1 */
        {
            static u32 ksu_sid;
            if(!ksu_sid){
                security_secctx_to_secid(\"u:r:su:s0\", strlen(\"u:r:su:s0\"), &ksu_sid);
            }
            if(new_tsec->sid == ksu_sid){
                return 0;
            }
        }
        #endif"
        patch_file "security/selinux/hooks.c" "if (!nnp && !nosuid)" 0 "$HOOKS_PATCH_1" "KSU_SELINUX_BYPASS_UNIVERSAL_1"
        
        HOOKS_PATCH_2="
        #ifdef CONFIG_KSU
        /* KSU_SELINUX_BYPASS_UNIVERSAL_2 */
        {
            static u32 ksu_sid;
            if(!ksu_sid){
                security_secctx_to_secid(\"u:r:su:s0\", strlen(\"u:r:su:s0\"), &ksu_sid);
            }
            if(new_tsec->sid == ksu_sid){
                return 0;
            }
        }
        #endif"
        patch_file "security/selinux/hooks.c" "return 0; /* No change in credentials */" 1 "$HOOKS_PATCH_2" "KSU_SELINUX_BYPASS_UNIVERSAL_2"
        
        HOOKS_PATCH_3="
        #ifdef CONFIG_KSU
        {
            /* 🚨 案发现场临时伪造身份证 🚨 */
            extern bool is_ksu_transition(const void *old_tsec, const void *new_tsec);
            if (is_ksu_transition(current_security(), bprm->cred->security))
                return 0;
        }
        #endif"
        patch_file "security/selinux/hooks.c" "new_tsec = bprm->cred->security;" 0 "$HOOKS_PATCH_3" "is_ksu_transition"

        echo "==== 缝合 kernel/sys.c (Root提权命脉) ===="
        SYS_HOOK="
        #ifdef CONFIG_KSU
        {
            extern int ksu_handle_setuid_common(uid_t new_uid, uid_t old_uid, uid_t new_euid);
            ksu_handle_setuid_common(ruid, current_uid().val, euid);
        }
        #endif"
        patch_file "kernel/sys.c" "ksuid = make_kuid(ns, suid);" 1 "$SYS_HOOK" "ksu_handle_setuid_common"

        echo "==== 缝合 kernel/reboot.c (KSU核心通信后门) ===="
        REBOOT_HOOK="
        #ifdef CONFIG_KSU
        {
            extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
            if (ksu_handle_sys_reboot(magic1, magic2, cmd, &arg) == 0)
                return 0;
        }
        #endif"
        patch_file "kernel/reboot.c" "if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))" 0 "$REBOOT_HOOK" "ksu_handle_sys_reboot"

        echo "==== 缝合 fs/read_write.c (模块挂载注射器) ===="
        READ_HOOK="
        #ifdef CONFIG_KSU
        {
            extern bool ksu_init_rc_hook __read_mostly;
            extern void ksu_handle_sys_read(unsigned int fd);
            if (unlikely(ksu_init_rc_hook))
                ksu_handle_sys_read(fd);
        }
        #endif"
        patch_file "fs/read_write.c" "if (f.file) {" 0 "$READ_HOOK" "ksu_handle_sys_read"

        echo "==== 斩杀 -dirty 强迫症尾巴 ===="
        sed -i 's/-dirty//g' scripts/setlocalversion
        
        echo "✅ 原型级修复 + 幻影打孔全数完成！战车无敌，准备起飞！"
